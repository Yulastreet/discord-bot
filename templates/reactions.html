<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des Réactions</title>
  {% include "_styles.html" %}
  <style>
    .reaction-row {
      display: flex; align-items: center; gap: 12px;
      background: var(--color-bg-card); color: var(--color-text);
      padding: 14px 18px; border-radius: 18px; margin-bottom: 10px;
      border-left: 5px solid var(--color-secondary);
    }
    .reaction-row .uname { font-weight: 700; flex: 1; }
    .reaction-row .emo   { font-size: 26px; }
    .reaction-row .raw   { color: #777; font-size: 13px; margin-left: 12px; }
  </style>
</head>
<body>
<div class="layout">

  <div class="topbar">
    <h1>⚙️ Gestion des Réactions</h1>
    <div class="nav-pill">
      <a href="/dashboard">Dashboard</a>
      <a href="/search">Rechercher</a>
      <a href="/reactions" class="active">Réactions</a>
      <a href="/duels">Duels</a>
      <a href="/logout">Déconnexion</a>
    </div>
  </div>

  <div id="message" class="alert"></div>

  <div class="card mb-2">
    <div class="grid grid-2">
      <div class="field">
        <label for="userSelect">Utilisateur</label>
        <select id="userSelect">
          <option value="">-- Choisir un utilisateur --</option>
          {% for user in users %}
            <option value="{{ user[0] }}" data-username="{{ user[1] }}">
              {{ user[1] }} ({{ user[0] }})
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="field">
        <label for="emojiInput">Emoji</label>
        <input type="text" id="emojiInput" placeholder="Ex: 👍 ou &lt;:nom:id&gt;">
        <small style="color: #777; margin-top: 4px; display: block;">
          Exemples : 👍 😀 ou &lt;:custom:123456789&gt;
        </small>
      </div>
    </div>

    <div class="row mt-2">
      <button class="btn btn-primary" onclick="addReaction()">➕ Ajouter / Modifier</button>
      <button class="btn btn-danger"  onclick="removeReaction()">❌ Supprimer</button>
    </div>
  </div>

  <div class="card-dark">
    <h2 style="color: var(--color-primary);">📋 Réactions actives</h2>
    <div id="reactionsList" class="mt-1"></div>
  </div>

</div>

<script>
  let reactions = JSON.parse('{{ reactions|tojson|safe }}');
  if (typeof reactions === 'string') {
    reactions = JSON.parse(reactions);
  }

  function showMessage(msg, type = 'success') {
    const el = document.getElementById('message');
    el.textContent = msg;
    el.className = 'alert ' + type;
    setTimeout(() => el.className = 'alert', 3000);
  }

  function addReaction() {
    const userId = document.getElementById('userSelect').value;
    const emoji = document.getElementById('emojiInput').value;
    if (!userId || !emoji) {
      showMessage('Veuillez sélectionner un utilisateur et entrer un emoji', 'error');
      return;
    }
    fetch('/api/reactions/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: userId, emoji: emoji })
    })
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        showMessage('✅ Réaction ajoutée !');
        document.getElementById('emojiInput').value = '';
        setTimeout(() => location.reload(), 500);
      } else {
        showMessage(data.error || 'Erreur', 'error');
      }
    })
    .catch(err => { console.error(err); showMessage('Erreur: ' + err.message, 'error'); });
  }

  function removeReaction() {
    const userId = document.getElementById('userSelect').value;
    if (!userId) { showMessage('Veuillez sélectionner un utilisateur', 'error'); return; }
    fetch('/api/reactions/remove', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: userId })
    })
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        showMessage('✅ Réaction supprimée !');
        setTimeout(() => location.reload(), 500);
      } else {
        showMessage(data.error || 'Erreur', 'error');
      }
    })
    .catch(err => { console.error(err); showMessage('Erreur: ' + err.message, 'error'); });
  }

  function deleteReaction(userId) {
    if (!confirm('Supprimer la réaction ?')) return;
    fetch('/api/reactions/remove', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: userId })
    })
    .then(r => r.json())
    .then(data => {
      if (data.success) { showMessage('✅ Réaction supprimée !'); setTimeout(() => location.reload(), 500); }
      else showMessage(data.error || 'Erreur', 'error');
    })
    .catch(err => { console.error(err); showMessage('Erreur: ' + err.message, 'error'); });
  }

  function displayReactions() {
    const list = document.getElementById('reactionsList');
    if (!reactions || Object.keys(reactions).length === 0) {
      list.innerHTML = '<p class="muted">Aucune réaction configurée.</p>';
      return;
    }
    const userMap = {};
    document.querySelectorAll('#userSelect option').forEach(o => { if (o.value) userMap[o.value] = o.dataset.username; });
    list.innerHTML = Object.entries(reactions).map(([uid, emoji]) => `
      <div class="reaction-row">
        <span class="emo">${emoji}</span>
        <span class="uname">${userMap[uid] || uid}</span>
        <span class="raw">${emoji}</span>
        <button class="btn btn-danger btn-sm" onclick="deleteReaction('${uid}')">Supprimer</button>
      </div>
    `).join('');
  }

  displayReactions();
</script>
</body>
</html>
