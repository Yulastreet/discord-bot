{% extends "_base.html" %}
{% set active_nav = 'collection' %}

{% block title %}Collection · TookBot{% endblock %}
{% block crumb %}Collection{% endblock %}

{% block content %}
<style>
  .col-wrap { max-width: 1180px; margin: 0 auto; }
  /* barre unique : identite (avatar+nom) + outils sur la MEME ligne -> gagne de
     la hauteur pour que le classeur + fleches tiennent sans scroll. */
  .col-tools { display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .col-id { display:flex; align-items:center; gap:9px; margin-right:4px; flex:none; }
  .col-id img.av { width:38px; height:38px; border-radius:50%; object-fit:cover; background:var(--bg-2); }
  .col-id .who { font-size:15px; font-weight:900; line-height:1.1; white-space:nowrap; }
  .col-id .sub { color:var(--text-2); font-size:11px; white-space:nowrap; }
  .col-tools .input, .col-tools select { padding:8px 10px; border-radius:10px; background:var(--bg-1);
       border:1px solid var(--border); color:var(--text); font-size:13px; outline:none; }
  .col-tools .input { flex:0 1 200px; min-width:120px; }
  .col-tools select { flex:none; }
  .col-tools .input:focus { border-color:var(--accent); }
  .col-seg { display:flex; flex:none; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .col-seg button { padding:8px 13px; background:var(--bg-1); color:var(--text-2); border:none;
       cursor:pointer; font-size:13px; font-weight:700; }
  .col-seg button.active { background:var(--accent); color:#10240a; }
  .col-spacer { flex:1; }

  /* CARTE (cellule) partagee binder + simple */
  .cc { position:relative; border-radius:10px; overflow:hidden; background:var(--bg-2);
        border:2px solid var(--rcol,#3a3a3a); aspect-ratio: 2/3; }
  .cc img { width:100%; height:100%; object-fit:cover; display:block; }
  .cc .noimg { width:100%; height:100%; display:grid; place-items:center; color:var(--text-3); font-size:24px; }
  .cc .nm { position:absolute; left:0; right:0; bottom:0; padding:4px 6px; font-size:10px; font-weight:700;
            background:linear-gradient(transparent, rgba(0,0,0,.85)); color:#fff;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cc .cnt { position:absolute; top:4px; right:4px; font-size:10px; font-weight:800; color:#fff;
             background:rgba(0,0,0,.65); border-radius:6px; padding:1px 5px; }
  .cc .st { position:absolute; top:4px; left:4px; font-size:10px; }

  /* ===== CLASSEUR (binder) ===== */
  /* contraint a la hauteur de la fenetre : les cartes sont dimensionnees par la
     HAUTEUR des rangees (pas la largeur) pour que les 5x5 tiennent sans scroll. */
  .binder-perspective { perspective: 2400px; margin-bottom:10px; }
  /* fond CUIR noir texture + couture doree sur le contour */
  .binder { position:relative; transform-style: preserve-3d;
            width: fit-content; margin: 0 auto; max-width:100%;
            border-radius:16px; padding:18px;
            background:
              radial-gradient(circle at 28% 18%, rgba(255,255,255,.04), transparent 45%),
              repeating-linear-gradient(48deg, rgba(255,255,255,.015) 0 2px, transparent 2px 5px),
              repeating-linear-gradient(-42deg, rgba(0,0,0,.18) 0 2px, transparent 2px 5px),
              linear-gradient(160deg, #1c1a17, #070605 70%);
            border:1px solid #000;
            box-shadow: inset 0 0 70px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.05),
                        0 18px 50px rgba(0,0,0,.55); }
  /* couture doree (tirets) inset comme des points de couture */
  .binder::before { content:''; position:absolute; inset:8px; border-radius:11px;
            border:2px dashed #c9a24b; opacity:.85;
            box-shadow: 0 0 8px rgba(201,162,75,.25), inset 0 0 8px rgba(201,162,75,.12);
            pointer-events:none; }
  /* colonnes a la LARGEUR de la carte (pas 1fr) + gap minimal -> pochettes collees,
     comme un vrai classeur. La hauteur dispo dimensionne les cartes. */
  /* Tailles FIXES calculees depuis la hauteur dispo (pas de colonnes 'auto' qui
     buggent quand la page n'est pas pleine). 5 rangees + 5 colonnes toujours. */
  .binder-page { --cardh: calc((100vh - 215px) / 5);
                 display:grid;
                 grid-template-columns: repeat(5, calc(var(--cardh) * 0.6667));
                 grid-template-rows: repeat(5, var(--cardh));
                 gap:5px; justify-content:center;
                 transform-origin:left center; backface-visibility:hidden;
                 will-change: transform, opacity; }
  .binder-page .cc, .binder-page .cc-empty { width:100%; height:100%; aspect-ratio:auto; }
  .binder-page .cc-empty { border:2px dashed rgba(255,255,255,.07);
                 background:rgba(0,0,0,.22); border-radius:10px; }
  .binder-empty { color:#c8b89a; text-align:center; padding:60px; grid-column:1/-1; align-self:center; }
  /* fleches sur les cotes du classeur, centrees verticalement */
  .binder-row { display:flex; align-items:center; justify-content:center; gap:14px; }
  .binder-side { flex:none; width:50px; height:84px; border-radius:14px; cursor:pointer;
       border:1px solid var(--border); background:var(--bg-1); color:var(--text);
       font-size:22px; font-weight:900; transition:background .12s, border-color .12s; }
  .binder-side:hover:not(:disabled) { background:var(--bg-2); border-color:var(--accent); }
  .binder-side:disabled { opacity:.3; cursor:not-allowed; }
  /* chip "page courante" dans la barre d'outils */
  .col-pageno { flex:none; font-weight:800; font-size:13px; color:var(--text);
       background:var(--bg-1); border:1px solid var(--border); border-radius:10px;
       padding:8px 12px; min-width:72px; text-align:center; }

  /* ===== VUE SIMPLIFIEE ===== */
  /* grille qui scrolle a l'interieur -> les fleches laterales restent en place */
  .simple-scroll { flex:1 1 auto; min-width:0; max-height: calc(100vh - 200px);
                   overflow-y:auto; padding:2px 6px 2px 2px; }
  .simple-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap:10px; }
  .col-empty { color:var(--text-2); text-align:center; padding:50px; }

  @media (max-width:760px){
    .col-tools { flex-wrap:wrap; }
    .binder-page { grid-template-columns: repeat(3, auto); }
    .simple-grid { grid-template-columns: repeat(auto-fill, minmax(90px,1fr)); }
  }
</style>

<div class="col-wrap">
  <div id="colLoading" class="col-empty">Chargement…</div>

  <div class="col-tools" id="colTools" style="display:none;">
    <div class="col-id" id="colId"></div>
    <div class="col-seg">
      <button id="modeBinder" class="active" onclick="setMode('binder')">📖 Classeur</button>
      <button id="modeSimple" onclick="setMode('simple')">▦ Vue simplifiée</button>
    </div>
    <input id="colSearch" class="input" type="search" placeholder="🔍 Nom ou origine…" oninput="applyFilters()">
    <span class="col-pageno" id="bPageNo">— / —</span>
    <select id="colPerPage" onchange="onPerPageChange()" style="display:none;">
      <option value="25">25 / page</option>
      <option value="50">50 / page</option>
      <option value="100">100 / page</option>
      <option value="250">250 / page</option>
      <option value="500">500 / page</option>
    </select>
    <select id="colSort" onchange="applyFilters()">
      <option value="rarity">Tri : Rareté</option>
      <option value="name">Tri : Nom</option>
      <option value="stars">Tri : Étoiles</option>
      <option value="origine">Tri : Origine</option>
      <option value="univers">Tri : Univers</option>
    </select>
  </div>

  <!-- CLASSEUR : fleches sur les cotes, classeur au centre -->
  <div id="binderView">
    <div class="binder-row">
      <button class="binder-side" id="bPrev" onclick="binderTurn(-1)">◀</button>
      <div class="binder-perspective">
        <div class="binder"><div class="binder-page" id="binderPage"></div></div>
      </div>
      <button class="binder-side" id="bNext" onclick="binderTurn(1)">▶</button>
    </div>
  </div>

  <!-- VUE SIMPLIFIEE : fleches sur les cotes (comme le classeur), grille qui scrolle -->
  <div id="simpleView" style="display:none;">
    <div class="binder-row">
      <button class="binder-side" id="sPrev" onclick="simpleTurn(-1)">◀</button>
      <div class="simple-scroll" id="simpleScroll"><div class="simple-grid" id="simpleGrid"></div></div>
      <button class="binder-side" id="sNext" onclick="simpleTurn(1)">▶</button>
    </div>
  </div>

  <div id="colEmpty" class="col-empty" style="display:none;"></div>
</div>

<script>
const TARGET_UID = "{{ target_user_id }}";
const RCOL = { common:'#9aa0a6', rare:'#4cb5f9', epic:'#b06bf2', legendary:'#f5a524', mythic:'#ff5470', secret:'#c084fc' };
const RRANK = { secret:6, mythic:5, legendary:4, epic:3, rare:2, common:1 };
const BINDER_PER = 25;

let ALL = [];        // toutes les cartes (brut)
let VIEW = [];       // apres filtre+tri
let mode = 'binder';
let bPage = 0;       // page classeur (0-index)
let sPage = 0;       // page simplifiee
let simplePer = 50;

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(n){return (n||0).toLocaleString('fr-FR');}

function cardCell(c){
  const rcol = RCOL[c.rarity] || '#3a3a3a';
  const img = c.img ? `<img src="${esc(c.img)}" loading="lazy" alt="" onerror="this.outerHTML='<div class=\\'noimg\\'>🃏</div>'">` : `<div class="noimg">🃏</div>`;
  const cnt = c.count > 1 ? `<span class="cnt">×${c.count}</span>` : '';
  const st = c.stars > 0 ? `<span class="st">${'⭐'.repeat(Math.min(5,c.stars))}</span>` : '';
  return `<div class="cc" style="--rcol:${rcol}" title="${esc(c.name)} · ${esc((c.rarity||'').toUpperCase())}${c.origine?' · '+esc(c.origine):''}">
    ${img}${cnt}${st}<div class="nm">${esc(c.name)}</div></div>`;
}

function applyFilters(){
  const q = (document.getElementById('colSearch').value||'').trim().toLowerCase();
  const sort = document.getElementById('colSort').value;
  VIEW = ALL.filter(c => !q || (c.name||'').toLowerCase().includes(q) || (c.origine||'').toLowerCase().includes(q));
  VIEW.sort((a,b)=>{
    if(sort==='name')    return a.name.localeCompare(b.name,'fr');
    if(sort==='stars')   return (b.stars-a.stars) || a.name.localeCompare(b.name,'fr');
    if(sort==='origine') return (a.origine||'').localeCompare(b.origine||'','fr') || a.name.localeCompare(b.name,'fr');
    if(sort==='univers') return (a.univers||'').localeCompare(b.univers||'','fr') || a.name.localeCompare(b.name,'fr');
    // rarity (defaut)
    return (RRANK[b.rarity]||0)-(RRANK[a.rarity]||0) || a.name.localeCompare(b.name,'fr');
  });
  bPage = 0; sPage = 0;
  if(mode==='binder') renderBinder(); else renderSimple();
}

/* ===== CLASSEUR ===== */
function renderBinderPage(){
  const start = bPage*BINDER_PER;
  const slice = VIEW.slice(start, start+BINDER_PER);
  const page = document.getElementById('binderPage');
  if(!slice.length){
    page.innerHTML = '<div class="binder-empty">Aucune carte ici.</div>';
  } else {
    // remplit toujours la page a 25 cases : pochettes vides pour les trous.
    let html = slice.map(cardCell).join('');
    for(let i=slice.length; i<BINDER_PER; i++) html += '<div class="cc-empty"></div>';
    page.innerHTML = html;
  }
  const total = Math.max(1, Math.ceil(VIEW.length/BINDER_PER));
  document.getElementById('bPageNo').textContent = `${VIEW.length?bPage+1:0} / ${total}`;
  document.getElementById('bPrev').disabled = bPage<=0;
  document.getElementById('bNext').disabled = bPage>=total-1;
}
function renderBinder(){ renderBinderPage(); }
function binderTurn(dir){
  const total = Math.max(1, Math.ceil(VIEW.length/BINDER_PER));
  const next = bPage + dir;
  if(next<0 || next>total-1) return;
  const page = document.getElementById('binderPage');
  page.style.transformOrigin = 'left center';   // charniere gauche dans tous les cas
  if(dir > 0){
    // SUIVANT : l'ancienne page se rabat vers la gauche (sort), la nouvelle apparait
    // instantanement derriere.
    page.style.transition = 'transform .26s ease-in, opacity .26s ease-in';
    page.style.transform = 'rotateY(-110deg)';
    page.style.opacity = '0.1';
    setTimeout(()=>{
      bPage = next; renderBinderPage();
      page.style.transition = 'none';
      page.style.transform = 'rotateY(0deg)';
      page.style.opacity = '1';
    }, 260);
  } else {
    // PRECEDENT : l'ancienne disparait instant, la nouvelle se DEPLIE depuis la gauche
    // (animation inverse, logique du retour en arriere).
    bPage = next; renderBinderPage();
    page.style.transition = 'none';
    page.style.transform = 'rotateY(-110deg)';
    page.style.opacity = '0.1';
    void page.offsetWidth;   // reflow
    page.style.transition = 'transform .26s ease-out, opacity .26s ease-out';
    page.style.transform = 'rotateY(0deg)';
    page.style.opacity = '1';
  }
}

/* ===== VUE SIMPLIFIEE ===== */
function renderSimple(){
  const start = sPage*simplePer;
  const slice = VIEW.slice(start, start+simplePer);
  document.getElementById('simpleGrid').innerHTML = slice.length ? slice.map(cardCell).join('') : '<div class="col-empty">Aucune carte.</div>';
  const total = Math.max(1, Math.ceil(VIEW.length/simplePer));
  document.getElementById('bPageNo').textContent = `${VIEW.length?sPage+1:0} / ${total}`;  // chip partage en haut
  document.getElementById('sPrev').disabled = sPage<=0;
  document.getElementById('sNext').disabled = sPage>=total-1;
}
function simpleTurn(dir){
  const total = Math.max(1, Math.ceil(VIEW.length/simplePer));
  const next = sPage + dir;
  if(next<0 || next>total-1) return;
  sPage = next; renderSimple();
  const sc = document.getElementById('simpleScroll'); if(sc) sc.scrollTo({top:0, behavior:'smooth'});
}
function onPerPageChange(){
  simplePer = parseInt(document.getElementById('colPerPage').value,10)||50;
  sPage = 0; renderSimple();
}

function setMode(m){
  mode = m;
  document.getElementById('modeBinder').classList.toggle('active', m==='binder');
  document.getElementById('modeSimple').classList.toggle('active', m==='simple');
  document.getElementById('binderView').style.display = m==='binder' ? 'block':'none';
  document.getElementById('simpleView').style.display = m==='simple' ? 'block':'none';
  document.getElementById('colPerPage').style.display = m==='simple' ? 'inline-block':'none';
  // chip page : toujours visible (les 2 modes), mis a jour par le render actif
  if(m==='binder') renderBinder(); else renderSimple();
}

async function load(){
  const loading = document.getElementById('colLoading');
  if(!TARGET_UID){ loading.textContent='Aucun utilisateur ciblé.'; return; }
  try{
    const r = await fetch(`/api/public/collection/${TARGET_UID}`);
    const d = await r.json();
    const u = d.user || {};
    const av = u.avatar ? `<img class="av" src="${esc(u.avatar)}" alt="">` : `<div class="av"></div>`;
    document.getElementById('colId').innerHTML =
      `${av}<div><div class="who">🃏 ${esc(u.name)}</div>
        <div class="sub">${fmt(d.total)} cartes · ${fmt(d.unique)} uniques</div></div>`;
    ALL = d.cards || [];
    loading.style.display='none';
    if(!ALL.length){
      document.getElementById('colTools').style.display='flex';
      document.getElementById('binderView').style.display='none';
      document.getElementById('colEmpty').style.display='block';
      document.getElementById('colEmpty').textContent='Ce joueur ne possède aucune carte.';
      return;
    }
    document.getElementById('colTools').style.display='flex';
    applyFilters();
  }catch(e){
    loading.textContent='Erreur de chargement.';
  }
}
load();
</script>
{% endblock %}
