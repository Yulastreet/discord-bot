<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion — Bot Dashboard</title>
  {% include "_styles.html" %}
  <style>
    body { display: flex; align-items: center; justify-content: center; }
    .login-card {
      max-width: 420px;
      width: 100%;
      background: var(--color-bg-card);
      color: var(--color-text);
      border-radius: var(--radius-card);
      padding: 44px 36px;
      box-shadow: var(--shadow-card);
      text-align: center;
    }
    .login-card h1 { color: var(--color-text); font-size: 36px; margin-bottom: 8px; }
    .login-card .sub { color: #777; margin-bottom: 28px; font-size: 14px; }
    .login-card input { margin-bottom: 16px; }
    .login-card .err { color: var(--color-danger); margin-bottom: 12px; font-weight: 600; font-size: 14px; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>🤖 Bot Dashboard</h1>
    <div class="sub">Espace de gestion privé</div>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="POST">
      <input type="password" name="password" placeholder="Mot de passe" autofocus>
      <button class="btn btn-primary" style="width:100%;" type="submit">Connexion</button>
    </form>
  </div>
</body>
</html>
