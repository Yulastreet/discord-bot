<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>{{ boss_name }} · Combat live · TookBot</title>
<style>
  :root{ --gold:#c9a24b; --red:#ff3d57; --green:#4ade80;
    /* tailles pilotees par la HAUTEUR de l'ecran -> jamais coupe (focus PC) */
    --ph: clamp(160px, 25vh, 320px); --pw: calc(var(--ph) * 0.6667);
    --bh: clamp(200px, 37vh, 420px); --bw: calc(var(--bh) * 0.6667); }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ font-family:'Segoe UI',system-ui,sans-serif; color:#f1eadf; overflow:hidden;
    background:radial-gradient(circle at 50% 18%, #2a1438 0%, #150a1f 45%, #070409 100%); }
  #arena{ position:relative; width:100%; height:100vh; display:flex; flex-direction:column;
    align-items:center; transition:transform .08s; }
  #arena.shake{ animation:shake .42s; }
  @keyframes shake{ 0%,100%{transform:translate(0,0)} 15%{transform:translate(-9px,4px)}
    30%{transform:translate(8px,-5px)} 45%{transform:translate(-7px,3px)}
    60%{transform:translate(6px,4px)} 75%{transform:translate(-4px,-2px)} }

  /* ===== EQUIPE (haut) ===== */
  #team{ display:flex; gap:clamp(8px,1.4vw,20px); justify-content:center; flex-wrap:wrap;
    padding:58px 12px 6px; width:100%; max-width:1500px; }
  .pc{ width:var(--pw); position:relative; display:flex; flex-direction:column;
    align-items:center; transition:transform .18s, opacity .3s; }
  .pc.attack{ animation:lunge-up .4s ease; }
  @keyframes lunge-up{ 0%{transform:translateY(0)} 40%{transform:translateY(-26px) scale(1.05)} 100%{transform:translateY(0)} }
  .pc.hurt{ animation:hurt .4s; }
  @keyframes hurt{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
  .pc.ko{ opacity:.4; filter:grayscale(1); }
  .pc-img-wrap{ position:relative; border-radius:9px; overflow:hidden;
    width:var(--pw); height:var(--ph);
    background:#1a1320; border:2px solid #463353; box-shadow:0 6px 16px rgba(0,0,0,.5); }
  /* carte qui a deja une bordure in-game : pas de cadre ajoute */
  .pc-img-wrap.bordered{ border:none; background:transparent; border-radius:4px; }
  .pc-img-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .pc-img-wrap .noimg{ width:100%; height:100%; display:grid; place-items:center; font-size:30px; color:#5a4a66; }
  .pc-flash{ position:absolute; inset:0; opacity:0; pointer-events:none; }
  .pc-flash.red{ background:radial-gradient(circle, rgba(255,61,87,.55), transparent 70%); }
  .pc-flash.green{ background:radial-gradient(circle, rgba(74,222,128,.55), transparent 70%); }
  .pc-flash.on{ animation:flash .5s; }
  @keyframes flash{ 0%{opacity:0} 30%{opacity:1} 100%{opacity:0} }
  .pc .ko-skull{ position:absolute; inset:0; display:none; place-items:center; font-size:40px;
    text-shadow:0 2px 8px #000; }
  .pc.ko .ko-skull{ display:grid; }
  .pc-name{ font-size:clamp(13px,1.1vw,16px); font-weight:800; text-align:center; margin-top:6px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .pc-tags{ display:flex; gap:5px; justify-content:center; flex-wrap:wrap; margin-top:4px; }
  .tag{ font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:9px; white-space:nowrap; }
  .tag.elem{ background:rgba(120,90,170,.28); border:1px solid #5d4a82; color:#e3d6f5; }
  .tag.rar{ background:rgba(255,255,255,.07); border:1px solid #4a3a5a; color:#eadff7; }
  .tag.apt{ background:rgba(201,162,75,.18); border:1px solid #8a6f2e; color:#ffe3a3; }
  .tag .eico, .eico{ width:15px; height:15px; vertical-align:-3px; object-fit:contain; }
  .tag .rico, .rico, .card-row .rico{ width:16px; height:16px; vertical-align:-3px; object-fit:contain; }
  #bossSub .eico{ width:18px; height:18px; vertical-align:-4px; }
  .pc-stats{ font-size:13px; font-weight:800; text-align:center; margin-top:4px; color:#ffd9a8; }
  .pc-power{ text-align:center; margin-top:4px; font-size:13px; }
  .pc-power .pd{ height:16px; vertical-align:-3px; }
  body.fighting .pc-power{ display:none; }   /* combat lance : plus de puissance par membre */
  /* bloc puissance au milieu (equipe + boss), toujours visible */
  #powerCenter{ display:flex; flex-direction:column; gap:6px; align-items:center; margin-bottom:14px; }
  .pwc-row{ display:flex; align-items:center; justify-content:center; gap:10px;
    padding:5px 16px; border-radius:12px; background:rgba(0,0,0,.4); border:1px solid; }
  .pwc-row.team{ border-color:rgba(74,222,128,.4); box-shadow:0 0 14px rgba(74,222,128,.15); }
  .pwc-row.boss{ border-color:rgba(255,61,87,.4); box-shadow:0 0 14px rgba(255,61,87,.15); }
  .pwc-ico{ font-size:22px; line-height:1; }
  #powerCenter .pd{ height:34px; vertical-align:middle; }
  .pw{ display:inline-flex; align-items:center; gap:0; }
  .pd{ object-fit:contain; width:auto; }
  .pc-hp{ position:relative; width:100%; height:19px; border-radius:7px; background:#241a30; overflow:hidden;
    margin-top:6px; border:1px solid #000; box-shadow:inset 0 0 6px rgba(0,0,0,.6); }
  .pc-hp > i{ display:block; height:100%; background:linear-gradient(90deg,#1f9e63,#4ade80);
    width:100%; transition:width .6s ease; }
  .pc-hp > i.low{ background:linear-gradient(90deg,#a01530,#ff3d57); }
  .pc-hp .hpv{ position:absolute; inset:0; display:grid; place-items:center; font-size:12px;
    font-weight:800; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.95); white-space:nowrap; }

  /* ===== BOSS (centre/bas) ===== */
  #bossWrap{ flex:1; display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding-bottom:18px; width:100%; }
  #bossInfo{ text-align:center; margin-bottom:8px; }
  #bossName{ font-size:24px; font-weight:900; letter-spacing:.5px;
    text-shadow:0 2px 10px rgba(0,0,0,.7); }
  #bossSub{ font-size:13px; color:#c9b6da; margin-top:2px; }
  #bossHpOuter{ width:min(640px,86vw); height:26px; border-radius:14px; background:#1c1224;
    border:2px solid #000; box-shadow:inset 0 0 12px rgba(0,0,0,.7); overflow:hidden;
    position:relative; margin:0 auto; }
  #bossHp{ height:100%; width:100%; transition:width .7s ease;
    background:linear-gradient(90deg,#b3123b,#ff3d57); }
  #bossHpTxt{ position:absolute; inset:0; display:grid; place-items:center; font-size:13px;
    font-weight:900; text-shadow:0 1px 3px #000; }
  #bossCardWrap{ position:relative; margin-top:16px; width:var(--bw); height:var(--bh);
    border-radius:14px; overflow:hidden; border:3px solid #5a3a6e;
    box-shadow:0 14px 40px rgba(0,0,0,.7); transition:transform .12s, box-shadow .3s; }
  #bossCardWrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  #bossCardWrap .noimg{ width:100%; height:100%; display:grid; place-items:center; font-size:60px; color:#5a4a66; }
  #bossCardWrap.enraged{ border-color:var(--red);
    box-shadow:0 0 38px rgba(255,61,87,.75), 0 14px 40px rgba(0,0,0,.7);
    animation:enrage-pulse 1.1s infinite; }
  @keyframes enrage-pulse{ 0%,100%{box-shadow:0 0 30px rgba(255,61,87,.6),0 14px 40px rgba(0,0,0,.7)}
    50%{box-shadow:0 0 52px rgba(255,61,87,.95),0 14px 40px rgba(0,0,0,.7)} }
  #bossCardWrap.hit{ animation:boss-hit .4s; }
  @keyframes boss-hit{ 0%,100%{transform:translate(0,0)} 25%{transform:translate(-10px,5px) rotate(-1.5deg)}
    75%{transform:translate(9px,-4px) rotate(1.5deg)} }
  #bossCardWrap.lunge{ animation:boss-lunge .5s ease; }
  @keyframes boss-lunge{ 0%{transform:translateY(0)} 35%{transform:translateY(-30px) scale(1.06)} 100%{transform:translateY(0)} }
  .slash{ position:absolute; inset:0; pointer-events:none; opacity:0;
    background:linear-gradient(115deg, transparent 42%, rgba(255,255,255,.95) 49%, transparent 56%); }
  .slash.go{ animation:slash .42s; }
  @keyframes slash{ 0%{opacity:0; transform:translateX(-30%) scale(1.2)}
    35%{opacity:1} 100%{opacity:0; transform:translateX(30%) scale(1.2)} }

  /* ===== POPUPS DEGATS / SOIN ===== */
  .pop{ position:absolute; font-weight:900; pointer-events:none; z-index:30;
    text-shadow:0 2px 6px #000; animation:pop 1.1s ease-out forwards; white-space:nowrap; }
  @keyframes pop{ 0%{opacity:0; transform:translate(-50%,0) scale(.6)}
    20%{opacity:1; transform:translate(-50%,-18px) scale(1.15)}
    100%{opacity:0; transform:translate(-50%,-62px) scale(1)} }
  .pop.dmg{ color:#ff5470; font-size:34px; -webkit-text-stroke:1px rgba(0,0,0,.6);
    text-shadow:0 0 10px rgba(255,61,87,.7), 0 2px 6px #000; }
  .pop.dmg.crit{ color:#ffd23f; font-size:46px; text-shadow:0 0 14px rgba(255,210,63,.8), 0 2px 6px #000; }
  .pop.heal{ color:#34ff9e; font-size:28px; text-shadow:0 0 10px rgba(52,255,158,.7), 0 2px 6px #000; }
  .pop.small{ font-size:24px; }

  /* ===== INDICATEURS DE CIBLAGE (qui tape qui / qui soigne qui) ===== */
  #fx{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:36; }
  #fx .tbeam{ animation:tbeamfade .6s ease-in-out infinite alternate; }
  @keyframes tbeamfade{ from{opacity:.35} to{opacity:.95} }
  .tmark{ position:fixed; transform:translate(-50%,-120%); font-size:30px; z-index:37;
    pointer-events:none; text-shadow:0 2px 6px #000; }
  .tmark.teleg{ animation:tpulse .55s ease-in-out infinite alternate; }
  @keyframes tpulse{ from{ transform:translate(-50%,-115%) scale(.92); opacity:.75 }
    to{ transform:translate(-50%,-140%) scale(1.12); opacity:1 } }

  /* ===== BANNIERES ===== */
  #banner{ position:fixed; top:34%; left:0; right:0; text-align:center; z-index:50;
    pointer-events:none; }
  .banner-txt{ display:inline-block; font-size:46px; font-weight:900; letter-spacing:2px;
    padding:6px 26px; text-shadow:0 3px 16px #000; animation:bannerIn 1.5s ease forwards; }
  @keyframes bannerIn{ 0%{opacity:0; transform:scale(.5)} 20%{opacity:1; transform:scale(1.12)}
    35%{transform:scale(1)} 80%{opacity:1} 100%{opacity:0; transform:scale(1.05)} }
  .banner-enrage{ color:var(--red); }
  .banner-smash{ color:#ffb13d; }

  /* ===== LOG + STATUS ===== */
  #log{ position:fixed; right:16px; bottom:16px; width:min(460px,42vw); max-height:58vh;
    display:flex; flex-direction:column; overflow:hidden; font-size:15.5px; line-height:1.6;
    color:#eaddff; background:rgba(12,7,19,.82); border:1px solid #4a3a5a; border-radius:13px;
    padding:13px 16px; box-shadow:0 10px 34px rgba(0,0,0,.55); }
  #log .log-title{ font-size:13px; font-weight:900; text-transform:uppercase; letter-spacing:.6px;
    color:#c2b0db; margin-bottom:9px; }
  #log .log-rows{ overflow-y:auto; display:flex; flex-direction:column; gap:4px; }
  #log .log-rows .ln{ padding:3px 0; border-bottom:1px solid rgba(255,255,255,.05); }
  #log .log-rows .ln.crit{ color:#ffd23f; font-weight:700; }
  #log .log-rows .ln.boss{ color:#ff8aa0; }
  #log .log-rows .ln.heal{ color:#7ee0a3; }
  #log .log-rows::-webkit-scrollbar{ width:6px; }
  #log .log-rows::-webkit-scrollbar-thumb{ background:#43314f; border-radius:3px; }
  #status{ position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:40;
    font-size:13px; font-weight:700; color:#e8dcf5; background:rgba(10,6,16,.6);
    border:1px solid #33223f; border-radius:20px; padding:6px 16px; }
  #endOverlay{ position:fixed; inset:0; z-index:80; display:none; place-items:center;
    background:rgba(5,3,10,.82); backdrop-filter:blur(3px); }
  #endOverlay.show{ display:grid; }
  #endCard{ text-align:center; background:rgba(20,13,30,.92); border:1px solid #5a4570;
    border-radius:18px; padding:26px 30px; box-shadow:0 18px 60px rgba(0,0,0,.7);
    max-width:min(620px,92vw); }
  #endCard .big{ font-size:64px; font-weight:900; }
  #endCard .sub{ font-size:18px; color:#e0d3f2; margin-top:12px; }
  .victory .big{ color:var(--green); text-shadow:0 0 30px rgba(74,222,128,.6); }
  .defeat .big{ color:var(--red); text-shadow:0 0 30px rgba(255,61,87,.6); }
  /* coffre (chargement des recompenses) */
  .chest-wrap{ position:relative; display:grid; place-items:center; height:130px; margin:14px 0 6px; }
  .chest{ font-size:92px; line-height:1; display:inline-block; filter:drop-shadow(0 6px 14px rgba(0,0,0,.6)); }
  .chest.shake{ animation:chestShake 1.3s ease-in-out; }
  @keyframes chestShake{ 0%,100%{transform:rotate(0)} 8%{transform:rotate(-10deg)} 18%{transform:rotate(10deg)}
    28%{transform:rotate(-8deg)} 38%{transform:rotate(8deg)} 50%{transform:rotate(-6deg) scale(1.05)}
    62%{transform:rotate(6deg)} 74%{transform:rotate(-4deg) scale(1.1)} 86%{transform:rotate(3deg) scale(1.14)} }
  .chest.open{ animation:chestOpen .55s cubic-bezier(.3,1.5,.5,1) forwards; }
  @keyframes chestOpen{ 0%{transform:scale(1.14)} 45%{transform:scale(1.55) translateY(-8px)} 100%{transform:scale(1.25)} }
  .burst{ position:absolute; width:30px; height:30px; border-radius:50%; opacity:0;
    background:radial-gradient(circle, rgba(255,225,140,.95), rgba(255,200,80,.4) 40%, transparent 70%); }
  .burst.go{ animation:burst .6s ease-out forwards; }
  @keyframes burst{ 0%{opacity:0; transform:scale(.3)} 30%{opacity:1} 100%{opacity:0; transform:scale(11)} }

  /* ===== PANNEAU JOUEUR (gauche) ===== */
  #myPanel{ display:none; position:fixed; left:16px; top:64px; width:404px; max-height:88vh;
    overflow-y:auto; z-index:45; background:rgba(15,9,23,.95); border:1px solid #4a3a5a;
    border-radius:16px; padding:16px 18px; box-shadow:0 14px 46px rgba(0,0,0,.65); }
  #myPanel::-webkit-scrollbar{ width:8px; } #myPanel::-webkit-scrollbar-thumb{ background:#4a3a5a; border-radius:4px; }
  .mp-title{ font-size:18px; font-weight:900; color:#f5ecff; margin-bottom:14px; }
  .mp-sec-h{ font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:.6px;
    color:#bba6d6; margin:14px 0 8px; }
  .apt-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .apt-grid button{ text-align:left; padding:9px 12px; border-radius:10px; cursor:pointer; font-size:14px;
    font-weight:700; color:#ece2f7; background:rgba(255,255,255,.06); border:1px solid #4a3a5a; }
  .apt-grid button:hover{ background:rgba(255,255,255,.13); }
  .apt-grid button.active{ background:var(--gold); color:#221700; border-color:var(--gold); }
  .mp-tools{ display:flex; gap:8px; margin-bottom:10px; }
  .mp-tools input{ flex:1; min-width:0; padding:9px 11px; border-radius:9px; background:#1c1426;
    border:1px solid #4a3a5a; color:#eee; font-size:14px; outline:none; }
  .mp-tools select{ padding:9px; border-radius:9px; background:#1c1426; border:1px solid #4a3a5a;
    color:#eee; font-size:13px; max-width:120px; }
  .mp-tools #sortBtn{ padding:9px 12px; border-radius:9px; background:#2e2240; border:1px solid #5a4570;
    color:#ece2f7; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .mp-opt{ font-size:12px; color:#b09cc8; margin-bottom:8px; min-height:0; }
  .card-list{ display:flex; flex-direction:column; gap:6px; }
  .card-row{ display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:10px;
    background:rgba(255,255,255,.05); border:1px solid #3a2b48; cursor:pointer; font-size:14.5px; }
  .card-row:hover{ background:rgba(255,255,255,.12); border-color:#7a5aa0; }
  .card-row.active{ background:rgba(201,162,75,.22); border-color:var(--gold); }
  .card-row .cr-name{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    line-height:1.3; }
  .card-row .cr-uni{ color:#9a86b3; font-size:11.5px; }
  .card-row .cr-eff{ font-size:13px; color:#ffd23f; font-weight:800; }
  .card-row .cr-adv-up{ color:#ff8aa0; } .card-row .cr-adv-down{ color:#7fb6ff; }
  .mp-pager{ display:flex; align-items:center; justify-content:center; gap:12px; margin-top:11px; font-size:14px; }
  .mp-pager button{ padding:6px 16px; border-radius:9px; background:#2e2240; border:1px solid #5a4570;
    color:#ece2f7; cursor:pointer; font-size:15px; }
  .mp-pager button:disabled{ opacity:.35; cursor:default; }
  .mp-msg{ margin-top:10px; font-size:14px; min-height:18px; font-weight:700; }
  .mp-msg.ok{ color:#7ee0a3; } .mp-msg.err{ color:#ff8aa0; }
  .rw-hdr{ font-size:18px; color:#ffe3a3; margin:14px 0 18px; font-weight:800; }
  .rw-list{ display:flex; flex-direction:column; gap:11px; max-height:54vh; overflow-y:auto;
    width:min(560px,90vw); margin:0 auto; }
  .rw-row{ background:rgba(255,255,255,.08); border:1px solid #5a4570; border-radius:12px;
    padding:13px 16px; text-align:left; }
  .rw-head{ font-size:17px; font-weight:700; }
  .rw-head .rw-dmg{ float:right; color:#ffd9a8; font-size:14px; font-weight:800;
    background:rgba(255,140,60,.15); border:1px solid #8a6f2e; border-radius:8px; padding:2px 9px; }
  .rw-items{ font-size:15.5px; color:#d7f3df; margin-top:7px; font-weight:600; }
</style>
</head>
<body>
<div id="status">Connexion…</div>
<div id="arena">
  <div id="team"></div>
  <div id="bossWrap">
    <div id="powerCenter">
      <div class="pwc-row team"><span class="pwc-ico">🛡️</span><span class="pw" id="pwTeam"></span></div>
      <div class="pwc-row boss"><span class="pwc-ico">🐲</span><span class="pw" id="pwBoss"></span></div>
    </div>
    <div id="bossInfo">
      <div id="bossName">{{ boss_name }}</div>
      <div id="bossSub"></div>
    </div>
    <div id="bossHpOuter"><div id="bossHp"></div><div id="bossHpTxt"></div></div>
    <div id="bossCardWrap">
      <div class="noimg">🐲</div>
      <div class="slash" id="bossSlash"></div>
    </div>
  </div>
</div>
<div id="myPanel">
  <div class="mp-title">⚙️ Ma préparation</div>
  <div class="mp-sec-h">🩸 Aptitude</div>
  <div id="aptBtns" class="apt-grid"></div>
  <div class="mp-sec-h">🎴 Ma carte de combat</div>
  <div class="mp-tools">
    <input id="cardSearch" placeholder="🔍 Nom / univers…" oninput="renderCards()">
    <select id="elemFilter" onchange="loadCards()"></select>
    <button id="sortBtn" onclick="cycleSort()">🔃 Trier</button>
  </div>
  <div id="cardOpt" class="mp-opt"></div>
  <div id="cardList" class="card-list"></div>
  <div class="mp-pager"><button onclick="cardPage(-1)">◀</button>
    <span id="cardPageNo">1 / 1</span><button onclick="cardPage(1)">▶</button></div>
  <div id="mpMsg" class="mp-msg"></div>
</div>

<svg id="fx"></svg>
<div id="banner"></div>
<div id="log"><div class="log-title">📜 Historique</div><div class="log-rows" id="logRows"></div></div>
<div id="endOverlay"><div id="endCard"></div></div>

<script>
const BID = {{ boss_id }};
const ELEM_EMOJI = { eclat:'🔆', abysse:'🌊', fracture:'⛓', vif:'🩸', neant:'🕳' };
const ELEM_LABEL = { eclat:'Éclat', abysse:'Abysse', fracture:'Fracture', vif:'Vif', neant:'Néant' };
const APT_EMOJI  = { berserker:'🩸', gardien:'🛡️', soigneur:'💚', duelliste:'⚔️', executeur:'💀' };
const APT_LABEL  = { berserker:'Berserker', gardien:'Gardien', soigneur:'Soigneur', duelliste:'Duelliste', executeur:'Exécuteur' };
const RAR_EMOJI  = { common:'⚪', rare:'🔵', epic:'🟣', legendary:'🟠', mythic:'🔴', secret:'🌈' };
const RAR_LABEL  = { common:'Commune', rare:'Rare', epic:'Épique', legendary:'Légendaire', mythic:'Mythique', secret:'Secret' };
function eIco(key){ return `<img class="eico" src="/cards/img/element/${encodeURIComponent(key||'')}" onerror="this.remove()">`; }
function rIco(r){
  if(!r) return '';
  if(r==='secret') return RAR_EMOJI.secret;
  const fb = RAR_EMOJI[r]||'⚪';
  return `<img class="rico" src="/cards/img/rarity/${encodeURIComponent(r)}" onerror="this.outerHTML='${fb}'">`;
}
let lastEvt = 0;
let built = false;
let lastSig = '';
let ended = false;
let pollMs = 1500;
const P = {};            // uid -> {el, hpBar}
function fmt(n){ return (n||0).toLocaleString('fr-FR'); }
function fmtShort(n){ n=n||0; if(n>=1e6) return (n/1e6).toFixed(n>=1e7?0:1).replace('.',',')+'M';
  if(n>=1e4) return Math.round(n/1e3)+'k'; return fmt(n); }
// Puissance en chiffres-images. Joueur/total = format compact (1m345), boss = entier.
function powerStr(n, boss){
  n=Math.max(0,Math.round(n||0));
  if(boss) return String(n);
  if(n>=1e6){ const M=Math.floor(n/1e6), k=Math.floor(n/1000)%1000; return M+'m'+String(k).padStart(3,'0'); }
  return String(n);
}
function powerImgs(n, boss){
  let h=''; for(const ch of powerStr(n,boss)){
    let name=null;
    if(ch>='0'&&ch<='9') name = boss ? ch+'boss' : ch;
    else if(ch==='m') name='m';
    if(name) h+=`<img class="pd${boss?' pdb':''}" src="/cards/img/pdigit/${name}">`;
  }
  return h;
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function buildPlayers(players){
  const team = document.getElementById('team');
  team.innerHTML = '';
  Object.keys(P).forEach(k=>delete P[k]);
  players.forEach(p=>{
    const el = document.createElement('div');
    el.className = 'pc'; el.id = 'p_'+p.uid;
    const img = p.img ? `<img src="${esc(p.img)}" alt="">` : `<div class="noimg">🎴</div>`;
    const wrapCls = p.has_border ? 'pc-img-wrap bordered' : 'pc-img-wrap';
    const aptTag = p.aptitude
      ? `<span class="tag apt">${APT_EMOJI[p.aptitude]||''} ${esc(APT_LABEL[p.aptitude]||p.aptitude)}</span>` : '';
    el.innerHTML = `<div class="${wrapCls}">${img}
        <div class="pc-flash red"></div><div class="pc-flash green"></div>
        <div class="ko-skull">💀</div></div>
      <div class="pc-name">${esc(p.name)}</div>
      <div class="pc-tags">
        <span class="tag elem">${eIco(p.element)} ${esc(ELEM_LABEL[p.element]||p.element||'?')}</span>
        ${aptTag}
      </div>
      <div class="pc-power">⚡ <span class="pw">${powerImgs(p.power,false)}</span></div>
      <div class="pc-hp"><i></i><span class="hpv">❤️ ${fmtShort(p.hp)}</span></div>
      <div class="pc-stats">🗡️ ${fmt(p.atk)}</div>`;
    team.appendChild(el);
    P[p.uid] = { el, card: el.querySelector('.pc-img-wrap'), bar: el.querySelector('.pc-hp > i'),
                 hpv: el.querySelector('.hpv'), name: p.name };
  });
  built = true;
}

function syncHp(d){
  // boss
  const bpct = d.boss.max_hp ? Math.max(0, 100*d.boss.hp/d.boss.max_hp) : 0;
  document.getElementById('bossHp').style.width = bpct+'%';
  document.getElementById('bossHpTxt').textContent = `${fmt(d.boss.hp)} / ${fmt(d.boss.max_hp)} (${Math.round(bpct)}%)`;
  document.getElementById('bossSub').innerHTML =
    `${esc(d.boss.tier_label)} · ${eIco(d.boss.element)} ${esc(d.boss.element_label)} · 🗡️ ${fmt(d.boss.atk)}`
    + (d.boss.weak && d.boss.weak.length ? ` · faible: ${esc(d.boss.weak.join(' '))}` : '');
  // puissances (milieu) : equipe + boss, toujours visibles
  document.getElementById('pwTeam').innerHTML = powerImgs(d.team_power, false);
  document.getElementById('pwBoss').innerHTML = powerImgs(d.boss.power, true);
  // une fois le combat lance : on masque la puissance par membre (classe sur body)
  document.body.classList.toggle('fighting', d.boss.status !== 'recruiting');
  // joueurs
  d.players.forEach(p=>{
    const ref = P[p.uid]; if(!ref) return;
    const pct = p.max_hp ? Math.max(0, 100*p.hp/p.max_hp) : 0;
    ref.bar.style.width = pct+'%';
    if(ref.bar) ref.bar.classList.toggle('low', pct<=30);
    if(ref.hpv) ref.hpv.textContent = '❤️ '+fmtShort(p.hp);
    ref.el.classList.toggle('ko', p.hp<=0);
  });
}

/* ===== ANIMATIONS ===== */
function shakeArena(){ const a=document.getElementById('arena'); a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake'); }
function anim(el, cls){ if(!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function flashPlayer(uid, color){ const r=P[uid]; if(!r) return;
  const f=r.el.querySelector('.pc-flash.'+color); anim(f,'on'); }
function popOn(el, html, cls){
  if(!el) return;
  const p = document.createElement('div'); p.className='pop '+cls; p.innerHTML=html;
  const r = el.getBoundingClientRect();
  p.style.left = (r.left + r.width/2) + 'px';
  p.style.top  = (r.top + r.height*0.35) + 'px';
  p.style.position='fixed';
  document.body.appendChild(p);
  setTimeout(()=>p.remove(), 1200);
}
function banner(txt, cls){
  const b=document.getElementById('banner');
  b.innerHTML = `<div class="banner-txt ${cls}">${txt}</div>`;
  setTimeout(()=>{ if(b.firstChild) b.innerHTML=''; }, 1600);
}

function pname(uid){ return (P[uid] && P[uid].name) || 'Joueur'; }
function hist(html, cls){
  const rows=document.getElementById('logRows');
  const ln=document.createElement('div'); ln.className='ln'+(cls?' '+cls:''); ln.innerHTML=html;
  rows.appendChild(ln);
  while(rows.children.length>40) rows.removeChild(rows.firstChild);
  rows.scrollTop=rows.scrollHeight;
}
function histFor(ev){
  const t=ev.type, d=ev.data||{}, tn=d.turn?`<b>T${d.turn}</b> · `:'';
  if(t==='start') hist('⚔️ Le combat commence');
  else if(t==='party_hit') hist(`${tn}🗡️ L'équipe inflige <b>${fmt(d.total)}</b>${d.crit?' 🔥':''}`, d.crit?'crit':'');
  else if(t==='boss_aoe') hist(`${tn}👹 Le boss frappe l'équipe : <b>${fmt(d.total)}</b>${(d.kos&&d.kos.length)?' · 💀 '+d.kos.map(pname).join(', '):''}`,'boss');
  else if(t==='boss_smash') hist(`${tn}💥 Coup dévastateur sur <b>${pname(d.target)}</b> : -${fmt(d.dmg)}${d.ko?' 💀':''}`,'boss');
  else if(t==='enrage') hist('🔥 Le boss se déchaîne !','boss');
  else if(t==='boss_heal') hist(`🩹 Le boss se régénère +${fmt(d.amount)}`,'boss');
  else if(t==='party_heal') hist(`💚 ${pname(d.healer)} soigne ${pname(d.target)} +${fmt(d.amount)}`,'heal');
  else if(t==='end') hist(d.victory?'🎉 Victoire !':'💀 Défaite…');
}

const bossWrap = ()=>document.getElementById('bossCardWrap');
const TG = 750;   // duree du telegraphe (indicateur AVANT l'action)
const GAP = 560;  // pause apres l'action avant l'event suivant
function centerOf(el){ const r=el.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; }
// trait de visee qui s'ARRETE avant la carte cible (ne va pas dessus)
function tBeam(fromEl, toEl, color){
  if(!fromEl || !toEl) return;
  const svg=document.getElementById('fx'), ns='http://www.w3.org/2000/svg';
  const [x1,y1]=centerOf(fromEl); let [x2,y2]=centerOf(toEl);
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1;
  // marge avant la carte : basee sur la largeur (cartes cote a cote) + cap a 40%
  // de la distance -> jamais d'effondrement quand les cartes sont proches.
  const back=Math.min((toEl.getBoundingClientRect().width/2)+16, len*0.4);
  const k=Math.max(0.05,(len-back))/len; x2=x1+dx*k; y2=y1+dy*k;
  const ln=document.createElementNS(ns,'line');
  ln.setAttribute('x1',x1); ln.setAttribute('y1',y1); ln.setAttribute('x2',x2); ln.setAttribute('y2',y2);
  ln.setAttribute('stroke',color); ln.setAttribute('stroke-width','7'); ln.setAttribute('stroke-linecap','round');
  ln.setAttribute('stroke-dasharray','13 9'); ln.classList.add('tbeam');
  ln.style.filter=`drop-shadow(0 0 5px ${color})`; svg.appendChild(ln);
  const head=document.createElementNS(ns,'circle');
  head.setAttribute('cx',x2); head.setAttribute('cy',y2); head.setAttribute('r','11');
  head.setAttribute('fill',color); head.classList.add('tbeam');
  head.style.filter=`drop-shadow(0 0 6px ${color})`; svg.appendChild(head);
  setTimeout(()=>{ ln.remove(); head.remove(); }, TG);
}
// marqueur AU-DESSUS de la carte (pas dessus), visible pendant le telegraphe
function tMark(el, emoji){
  if(!el) return;
  const r=el.getBoundingClientRect();
  const m=document.createElement('div'); m.className='tmark teleg'; m.textContent=emoji;
  m.style.left=(r.left+r.width/2)+'px'; m.style.top=(r.top - 4)+'px';
  document.body.appendChild(m); setTimeout(()=>m.remove(), TG);
}
function alive(uid){ return P[uid] && !P[uid].el.classList.contains('ko'); }

// Chaque event : TELEGRAPHE (ou ca va taper/soigner) puis IMPACT (sans indicateur).
// Retourne la duree totale -> la file espace les actions (heal et degats jamais en meme temps).
function playEvent(ev){
  histFor(ev);
  const t = ev.type, d = ev.data||{};
  if(t==='party_hit'){
    Object.keys(P).forEach(uid=>{ if(alive(uid)) tBeam(P[uid].card, bossWrap(), '#ffd23f'); });
    tMark(bossWrap(), '⚔️');
    setTimeout(()=>{
      Object.keys(P).forEach(uid=>{ if(alive(uid)) anim(P[uid].el,'attack'); });
      anim(document.getElementById('bossSlash'),'go'); anim(bossWrap(),'hit');
      popOn(bossWrap(), '-'+fmt(d.total), 'dmg'+(d.crit?' crit':''));
    }, TG);
    return TG + GAP;
  }
  if(t==='boss_aoe'){
    (d.targets||[]).forEach(uid=>{ const r=P[uid]; if(!r) return; tBeam(bossWrap(), r.card, '#ff3d57'); tMark(r.card,'⚠️'); });
    setTimeout(()=>{
      anim(bossWrap(),'lunge'); shakeArena();
      (d.targets||[]).forEach(uid=>{ const r=P[uid]; if(!r) return; flashPlayer(uid,'red'); anim(r.el,'hurt'); popOn(r.card,'-'+fmt(d.total),'dmg small'); });
      popOn(bossWrap(), '👹', 'dmg small');
      (d.kos||[]).forEach(uid=>{ const r=P[uid]; if(r){ r.el.classList.add('ko'); popOn(r.card,'💀','dmg small'); } });
    }, TG);
    return TG + GAP;
  }
  if(t==='boss_smash'){
    const r=P[d.target];
    if(r){ tBeam(bossWrap(), r.card, '#ff8a1f'); tMark(r.card,'🎯'); }
    banner('💥 COUP DÉVASTATEUR', 'banner-smash');
    setTimeout(()=>{
      anim(bossWrap(),'lunge'); shakeArena();
      if(r){ flashPlayer(d.target,'red'); anim(r.el,'hurt'); popOn(r.card,'-'+fmt(d.dmg),'dmg crit');
        if(d.ko) r.el.classList.add('ko'); }
    }, TG);
    return TG + GAP;
  }
  if(t==='party_heal'){
    const hr=P[d.healer], tr=P[d.target];
    if(hr && tr) tBeam(hr.card, tr.card, '#34ff9e');
    if(tr) tMark(tr.card,'💚');
    setTimeout(()=>{ flashPlayer(d.target,'green'); popOn(tr?tr.card:null, '+'+fmt(d.amount), 'heal'); }, TG);
    return TG + GAP;
  }
  if(t==='enrage'){
    banner('🔥 DÉCHAÎNÉ', 'banner-enrage'); bossWrap().classList.add('enraged');
    document.getElementById('bossHp').style.background='linear-gradient(90deg,#7a0a1f,#ff1f44)';
    return 850;
  }
  if(t==='boss_heal'){ popOn(bossWrap(), '+'+fmt(d.amount), 'heal'); return 750; }
  if(t==='rewards'){ renderRewards(d); return 300; }
  if(t==='end'){ showEnd(d.victory); return 300; }
  return 300;
}

let dead = false;
let pendingRewards = null, chestDone = false;
function showEnd(victory){
  if(ended) return; ended = true;
  const ov=document.getElementById('endOverlay');
  const c=document.getElementById('endCard');
  c.className = victory ? 'victory' : 'defeat';
  if(victory){
    c.innerHTML = `<div class="big">🎉 VICTOIRE</div>
      <div class="chest-wrap"><div class="burst" id="burst"></div><div class="chest shake" id="chest">🎁</div></div>
      <div class="sub" id="chestSub">Ouverture du butin…</div>`;
    ov.classList.add('show');
    const chest=document.getElementById('chest');
    setTimeout(()=>{ chest.classList.remove('shake'); chest.classList.add('open');
      chest.textContent='🎉'; document.getElementById('burst').classList.add('go'); }, 1300);
    setTimeout(()=>{ chestDone=true; if(pendingRewards) renderRewards(pendingRewards); }, 1900);
  } else {
    c.innerHTML = `<div class="big">💀 DÉFAITE</div><div class="sub">L'équipe a été anéantie.</div>`;
    ov.classList.add('show');
    startKill();
  }
}
function renderRewards(data){
  if(!chestDone){ pendingRewards = data; return; }   // attend la fin de l'animation du coffre
  const c=document.getElementById('endCard');
  c.className='victory';
  const rows=(data.players||[]).map(p=>`
    <div class="rw-row">
      <div class="rw-head">${p.mvp?'👑 ':'▫️ '}<b>${esc(p.name)}</b>
        <span class="rw-dmg">🗡️ ${fmt(p.dmg)} dégâts</span></div>
      <div class="rw-items">${(p.items||[]).map(esc).join(' · ')}</div>
    </div>`).join('') || '<div class="sub">—</div>';
  c.innerHTML = `<div class="big">🎉 VICTOIRE</div>
    <div class="rw-hdr">${esc(data.header||'')}</div>
    <div class="rw-list">${rows}</div>
    <div class="sub" id="killCount"></div>`;
  startKill();   // compte a rebours 10s a partir de l'affichage des recompenses
}
let killStarted=false;
function startKill(){
  if(killStarted) return; killStarted=true;
  let left=10;
  const tickCount=()=>{
    const el=document.getElementById('killCount');
    if(el) el.textContent = `Cette page se fermera dans ${left}s…`;
    if(left<=0){ killPage(); return; }
    left--; setTimeout(tickCount, 1000);
  };
  tickCount();
}
function killPage(){
  dead = true;
  document.body.innerHTML =
    '<div style="position:fixed;inset:0;display:grid;place-items:center;'
    + 'color:#7a6a8c;font-family:system-ui;font-size:18px;">Combat terminé.</div>';
}

/* ===== FILE D'EVENEMENTS (joue en sequence) ===== */
let queue = [];
let playing = false;
function pump(){
  if(playing) return;
  const ev = queue.shift();
  if(!ev){ playing=false; return; }
  playing = true;
  const ms = playEvent(ev) || 500;
  setTimeout(()=>{ playing=false; pump(); }, ms);
}
function enqueue(events){ events.forEach(e=>queue.push(e)); pump(); }

/* ===== STATUS ===== */
function setStatus(d){
  const s=document.getElementById('status');
  const st=d.boss.status;
  if(st==='recruiting'){
    let txt='🐲 Recrutement en cours…';
    if(d.boss.start_at){ const left=Math.max(0,Math.round(d.boss.start_at-d.now));
      txt = `🐲 Le combat démarre dans ${left}s`; }
    s.textContent=txt; s.style.display='block';
  } else if(st==='fighting'){
    s.textContent='⚔️ Combat en cours'; s.style.display='block';
  } else if(st==='defeated'){ showEnd(true); s.style.display='none';
  } else if(st==='wiped'||st==='expired'){ showEnd(st==='wiped'?false:true); s.style.display='none';
  } else { s.style.display='none'; }
  maybePanel(st);
}

/* ===== PANNEAU JOUEUR : choisir aptitude + carte ===== */
const MY = { participant:false, aptitude:'', card_id:null };
let ALLCARDS = [], cardP = 1, bossEl = '';
const PER = 10;
const SORT_CYCLE = [null,'nom','rareté','étoiles','optimisation'];
const SORT_LBL = { 'null':'🔃 Trier', 'nom':'🔤 Nom', 'rareté':'🎯 Rareté', 'étoiles':'⭐ Étoiles', 'optimisation':'⚡ Optimal' };
let curSort = null;
const APT_LIST = ['berserker','gardien','soigneur','duelliste','executeur','none'];
const APT_DESC = { berserker:'Berserker', gardien:'Gardien', soigneur:'Soigneur',
  duelliste:'Duelliste', executeur:'Exécuteur', none:'Aucune' };

async function initPanel(){
  try{
    const r = await fetch(`/cards/boss/${BID}/me`);
    const d = await r.json();
    MY.participant = !!d.is_participant;
    MY.aptitude = d.aptitude || '';
    MY.card_id = d.card_id || null;
    if(MY.participant){
      // remplit le filtre element
      const sel=document.getElementById('elemFilter');
      sel.innerHTML = '<option value="all">Tous éléments</option>'
        + Object.keys(ELEM_LABEL).map(k=>`<option value="${k}">${ELEM_LABEL[k]}</option>`).join('');
      renderApt();
      await loadCards();
    }
    maybePanel(d.status);
  }catch(e){}
}
function maybePanel(status){
  const show = MY.participant && status==='recruiting';
  document.getElementById('myPanel').style.display = show ? 'block' : 'none';
}
function renderApt(){
  document.getElementById('aptBtns').innerHTML = APT_LIST.map(a=>{
    const lbl = a==='none' ? '➖ Aucune' : `${APT_EMOJI[a]||''} ${APT_DESC[a]}`;
    const on = (MY.aptitude||'none')===a ? ' active' : '';
    return `<button class="${on.trim()}" onclick="setApt('${a}')">${lbl}</button>`;
  }).join('');
}
async function setApt(v){
  const msg=document.getElementById('mpMsg');
  try{
    const r=await fetch(`/cards/boss/${BID}/set-aptitude`,{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({aptitude:v})});
    const d=await r.json();
    if(d.ok){ MY.aptitude=(v==='none'?'':v); renderApt(); msg.className='mp-msg ok'; msg.textContent='Aptitude mise à jour ✓'; }
    else { msg.className='mp-msg err'; msg.textContent=d.error||'Erreur'; }
  }catch(e){ msg.className='mp-msg err'; msg.textContent='Erreur réseau'; }
}
function cycleSort(){
  const i=SORT_CYCLE.indexOf(curSort); curSort=SORT_CYCLE[(i+1)%SORT_CYCLE.length];
  document.getElementById('sortBtn').textContent=SORT_LBL[String(curSort)];
  loadCards();
}
async function loadCards(){
  const el=document.getElementById('elemFilter').value;
  const q=new URLSearchParams({element:el||'all', sort:curSort||''});
  try{
    const r=await fetch(`/cards/boss/${BID}/my-cards?`+q.toString());
    const d=await r.json();
    if(d.error){ return; }
    ALLCARDS=d.cards||[]; bossEl=d.boss_element_label||'';
    cardP=1; renderCards();
    document.getElementById('cardOpt').textContent = (curSort==='optimisation')
      ? `⚡ Classé par dégâts réels vs boss ${bossEl} (👑 = meilleur)` : '';
  }catch(e){}
}
function renderCards(){
  const q=(document.getElementById('cardSearch').value||'').trim().toLowerCase();
  const list = ALLCARDS.filter(c=> !q || (c.name||'').toLowerCase().includes(q) || (c.universe||'').toLowerCase().includes(q));
  const total=Math.max(1, Math.ceil(list.length/PER));
  if(cardP>total) cardP=total;
  const slice=list.slice((cardP-1)*PER, cardP*PER);
  const opt = curSort==='optimisation';
  document.getElementById('cardList').innerHTML = slice.map((c,i)=>{
    const idx=(cardP-1)*PER+i;
    const crown = (opt && idx===0) ? '👑 ' : '';
    const stars = c.stars>0 ? ' '+'⭐'.repeat(Math.min(5,c.stars)) : '';
    const cnt = c.count>1 ? ` ×${c.count}` : '';
    const adv = c.adv==='up' ? '<span class="cr-adv-up">🔥</span>' : (c.adv==='down'?'<span class="cr-adv-down">🟦</span>':'');
    const eff = opt ? `<span class="cr-eff">×${c.eff}</span>` : '';
    const active = (String(c.card_id)===String(MY.card_id)) ? ' active' : '';
    return `<div class="card-row${active}" onclick="setCard(${c.card_id})">
      <span>${rIco(c.rarity)}</span>${eIco(c.element)}
      <span class="cr-name">${crown}${esc(c.name)}${stars}${cnt} ${adv}<br><span class="cr-uni">${esc(c.universe||'')}</span></span>
      ${eff}</div>`;
  }).join('') || '<div class="cr-uni" style="padding:8px;">Aucune carte.</div>';
  document.getElementById('cardPageNo').textContent=`${cardP} / ${total}`;
  document.querySelector('.mp-pager button:first-child').disabled = cardP<=1;
  document.querySelector('.mp-pager button:last-child').disabled = cardP>=total;
}
function cardPage(dir){ cardP=Math.max(1,cardP+dir); renderCards(); }
async function setCard(cid){
  const msg=document.getElementById('mpMsg');
  try{
    const r=await fetch(`/cards/boss/${BID}/set-card`,{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({card_id:cid})});
    const d=await r.json();
    if(d.ok){ MY.card_id=cid; renderCards(); msg.className='mp-msg ok'; msg.textContent='Carte engagée ✓'; }
    else { msg.className='mp-msg err'; msg.textContent=d.error||'Erreur'; }
  }catch(e){ msg.className='mp-msg err'; msg.textContent='Erreur réseau'; }
}
window.setApt=setApt; window.cycleSort=cycleSort; window.loadCards=loadCards;
window.renderCards=renderCards; window.cardPage=cardPage; window.setCard=setCard;

let firstLoad = true;
async function tick(){
  if(dead) return;
  try{
    const r = await fetch(`/cards/boss/${BID}/state?after=${lastEvt}`);
    if(!r.ok){ throw new Error('http'); }
    const d = await r.json();
    // cold load APRES la fin : pas de replay d'animation, affiche direct le resultat
    if(firstLoad && ['defeated','wiped','expired'].includes(d.boss.status)){
      firstLoad = false;
      buildPlayers(d.players); lastSig='cold'; syncHp(d);
      const rew = d.events.find(e=>e.type==='rewards');
      const endE = d.events.find(e=>e.type==='end');
      showEnd(endE ? endE.data.victory : d.boss.status==='defeated');
      if(rew) renderRewards(rew.data);
      return;   // startKill (via showEnd) fermera la page
    }
    firstLoad = false;
    // ordre STABLE par uid : la liste backend peut changer d'ordre (tri par degats),
    // on ne veut pas que les cartes s'echangent de place (ex: a la mort d'un membre).
    d.players.sort((a,b)=>String(a.uid).localeCompare(String(b.uid)));
    // rebuild si la compo change (joueur rejoint, change de carte / element / aptitude)
    const sig = d.players.map(p=>`${p.uid}:${p.img||''}:${p.element}:${p.aptitude}:${p.max_hp}:${p.has_border?1:0}`).join('|');
    if(!built || sig !== lastSig){ buildPlayers(d.players); lastSig = sig; }
    // image boss (1x)
    const bw = bossWrap();
    if(d.boss.img && !bw.dataset.img){ bw.dataset.img=d.boss.img;
      bw.querySelector('.noimg')?.remove();
      const im=document.createElement('img'); im.src=d.boss.img; bw.prepend(im); }
    syncHp(d);
    setStatus(d);
    if(d.events && d.events.length){
      lastEvt = d.events[d.events.length-1].id;
      enqueue(d.events);
    }
    // ralentit le poll quand fini
    pollMs = (d.boss.status==='fighting'||d.boss.status==='recruiting') ? 1500 : 6000;
  }catch(e){
    document.getElementById('status').textContent='Reconnexion…';
  }
  setTimeout(tick, pollMs);
}
tick();
initPanel();
</script>
</body>
</html>
