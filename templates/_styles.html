<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ========================================================================
   Design tokens — Restrained warm-neutral + lime acide
   Dark primary, light twin. OKLCH-only.
   ======================================================================== */

:root {
  /* Surfaces — warm neutral dark, less eye-strain than near-black */
  --bg:           oklch(0.175 0.004 60);
  --bg-1:         oklch(0.215 0.005 60);
  --bg-2:         oklch(0.255 0.006 60);
  --bg-3:         oklch(0.300 0.008 60);
  --bg-overlay:   oklch(0.13 0.003 60 / 0.78);

  /* Borders — visible but soft */
  --border:        oklch(0.32 0.007 60 / 0.55);
  --border-strong: oklch(0.45 0.009 60 / 0.7);
  --border-soft:   oklch(0.27 0.006 60 / 0.45);

  /* Text — slightly off-white for comfort */
  --text:    oklch(0.94 0.004 60);
  --text-2:  oklch(0.73 0.006 60);
  --text-3:  oklch(0.55 0.008 60);

  /* Accent — vert acide */
  --accent:        oklch(0.86 0.20 130);
  --accent-strong: oklch(0.78 0.22 130);
  --accent-soft:   oklch(0.86 0.20 130 / 0.12);
  --accent-text:   oklch(0.18 0.04 130);

  /* Status (warm, never cold) */
  --danger:      oklch(0.66 0.20 25);
  --danger-soft: oklch(0.66 0.20 25 / 0.14);
  --warn:        oklch(0.80 0.16 75);
  --warn-soft:   oklch(0.80 0.16 75 / 0.14);
  --info:        oklch(0.82 0.06 200);
  --success:     oklch(0.78 0.16 145);

  /* Rarity badges (semantic, not theme-bound) */
  --rar-c:   oklch(0.72 0.005 60);
  --rar-uc:  oklch(0.78 0.18 145);
  --rar-r:   oklch(0.72 0.16 230);
  --rar-sr:  oklch(0.68 0.20 305);
  --rar-ssr: oklch(0.86 0.20 80);

  /* Radius */
  --r-1: 6px;
  --r-2: 10px;
  --r-3: 14px;
  --r-4: 20px;

  /* Type scale */
  --t-xs: 12px;
  --t-sm: 13px;
  --t-base: 15px;
  --t-md: 17px;
  --t-lg: 22px;
  --t-xl: 28px;
  --t-2xl: 36px;
  --t-3xl: 48px;

  /* Spacing */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px;
  --s-5: 20px; --s-6: 24px; --s-7: 32px; --s-8: 40px;
  --s-9: 48px; --s-10: 64px; --s-11: 80px; --s-12: 112px;

  /* Sidebar */
  --sidebar-w: 244px;
  --topbar-h:  60px;

  /* Typography stacks */
  --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* Easing */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-quart: cubic-bezier(0.25, 1, 0.5, 1);

  /* Shadows (soft, no glow) */
  --shadow-1: 0 1px 2px oklch(0 0 0 / 0.32);
  --shadow-2: 0 8px 24px oklch(0 0 0 / 0.32);
  --shadow-3: 0 24px 60px oklch(0 0 0 / 0.40);

  color-scheme: dark;
}

[data-theme="light"] {
  --bg:           oklch(0.985 0.002 60);
  --bg-1:         oklch(0.962 0.003 60);
  --bg-2:         oklch(0.935 0.004 60);
  --bg-3:         oklch(0.905 0.005 60);
  --bg-overlay:   oklch(0.30 0.005 60 / 0.36);

  --border:        oklch(0.86 0.005 60);
  --border-strong: oklch(0.74 0.006 60);
  --border-soft:   oklch(0.92 0.004 60);

  --text:    oklch(0.20 0.005 60);
  --text-2:  oklch(0.42 0.007 60);
  --text-3:  oklch(0.58 0.008 60);

  --accent:        oklch(0.74 0.22 130);
  --accent-strong: oklch(0.66 0.24 130);
  --accent-soft:   oklch(0.74 0.22 130 / 0.18);
  --accent-text:   oklch(0.18 0.04 130);

  --danger:      oklch(0.56 0.22 25);
  --danger-soft: oklch(0.56 0.22 25 / 0.14);
  --warn:        oklch(0.62 0.18 75);
  --warn-soft:   oklch(0.62 0.18 75 / 0.14);
  --info:        oklch(0.50 0.10 230);
  --success:     oklch(0.58 0.18 145);

  --rar-c:   oklch(0.55 0.006 60);
  --rar-uc:  oklch(0.55 0.18 145);
  --rar-r:   oklch(0.50 0.18 230);
  --rar-sr:  oklch(0.50 0.20 305);
  --rar-ssr: oklch(0.62 0.22 80);

  --shadow-1: 0 1px 2px oklch(0.50 0.005 60 / 0.08);
  --shadow-2: 0 12px 32px oklch(0.30 0.005 60 / 0.10);
  --shadow-3: 0 24px 60px oklch(0.30 0.005 60 / 0.14);

  color-scheme: light;
}

/* ========================================================================
   Reset + base
   ======================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

html {
  font-family: var(--font-sans);
  font-size: var(--t-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  background: var(--bg);
  color: var(--text);
}

body {
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-feature-settings: "ss01", "cv11", "cv02";
}

a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-strong); }

img, svg { display: block; max-width: 100%; }

/* Default icon size — overridden by .sidebar .ic / .btn .ic / contextual rules */
.ic { width: 16px; height: 16px; flex-shrink: 0; }

/* ========================================================================
   Typography
   ======================================================================== */
h1, h2, h3, h4 {
  font-family: var(--font-sans);
  letter-spacing: -0.015em;
  margin: 0;
  font-weight: 600;
  color: var(--text);
}
h1 { font-size: var(--t-2xl); line-height: 1.05; letter-spacing: -0.025em; font-weight: 600; }
h2 { font-size: var(--t-xl); line-height: 1.15; letter-spacing: -0.02em; }
h3 { font-size: var(--t-md); line-height: 1.25; }
h4 { font-size: var(--t-base); line-height: 1.3; }

p { margin: 0; }

.mono, code { font-family: var(--font-mono); font-size: 0.9em; letter-spacing: -0.01em; }
.eyebrow {
  font-size: var(--t-xs);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--text-3);
}

.muted   { color: var(--text-2); }
.faint   { color: var(--text-3); }

/* ========================================================================
   Layout shell — sidebar + main
   ======================================================================== */
.app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 100vh;
}

/* SIDEBAR */
.sidebar {
  background: var(--bg-1);
  border-right: 1px solid var(--border);
  position: sticky;
  top: 0;
  align-self: start;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: var(--s-6) var(--s-3);
  z-index: 30;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.sidebar .brand {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-2) var(--s-3) var(--s-7);
}
.sidebar .brand-mark {
  width: 28px; height: 28px;
  border-radius: var(--r-1);
  background: var(--accent);
  display: grid; place-items: center;
  color: var(--accent-text);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: -0.02em;
}
.sidebar .brand-name {
  font-weight: 600;
  font-size: var(--t-sm);
  letter-spacing: -0.01em;
}
.sidebar nav { display: flex; flex-direction: column; gap: 1px; flex: 1; }
.sidebar details.nav-cat {
  margin: var(--s-2) 0;
}
.sidebar details.nav-cat > summary {
  list-style: none;
  cursor: pointer;
  user-select: none;
}
.sidebar details.nav-cat > summary::-webkit-details-marker { display: none; }
.sidebar .nav-section {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-2);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--text);
  padding: 8px 12px;
  margin: 4px 0;
  background: linear-gradient(90deg,
      oklch(0.86 0.20 130 / .14),
      oklch(0.86 0.20 130 / .04));
  border: 1px solid oklch(0.86 0.20 130 / .25);
  border-radius: 8px;
  transition: background 140ms var(--ease-out), border-color 140ms var(--ease-out);
}
.sidebar .nav-section:hover {
  background: linear-gradient(90deg,
      oklch(0.86 0.20 130 / .22),
      oklch(0.86 0.20 130 / .08));
  border-color: oklch(0.86 0.20 130 / .45);
}
.sidebar .nav-section .chevron {
  width: 14px; height: 14px;
  color: var(--text-2);
  transition: transform 180ms var(--ease-out);
}
.sidebar details.nav-cat[open] > summary .chevron {
  transform: rotate(180deg);
}
/* Categorie repliee : items non rendus, animation simple */
.sidebar details.nav-cat:not([open]) .nav-section {
  background: var(--bg-2);
  border-color: var(--border);
  color: var(--text-2);
}
.sidebar a.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 12px;
  margin: 1px 0;
  border-radius: 8px;
  color: var(--text-2);
  font-size: 13px;
  font-weight: 500;
  transition: background 120ms var(--ease-out), color 120ms var(--ease-out);
  position: relative;
}
.sidebar a.nav-item:hover { background: var(--bg-2); color: var(--text); }
.sidebar a.nav-item.active {
  background: linear-gradient(90deg, oklch(0.86 0.20 130 / .14), oklch(0.86 0.20 130 / .04));
  color: var(--text);
}
.sidebar a.nav-item.active::before {
  content: "";
  position: absolute;
  left: 0; top: 8px; bottom: 8px;
  width: 3px;
  background: var(--accent);
  border-radius: 0 3px 3px 0;
  box-shadow: 0 0 8px oklch(0.86 0.20 130 / .6);
}
.sidebar a.nav-item.active .ic { color: var(--accent); }
.sidebar .ic {
  width: 16px; height: 16px;
  flex-shrink: 0;
  color: var(--text-3);
  transition: color 120ms var(--ease-out);
}
.sidebar a.nav-item:hover .ic { color: var(--text-2); }

.kofi-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: var(--s-3);
  padding: 10px 14px;
  border-radius: var(--r-2);
  border: 1px solid oklch(0.86 0.20 130 / 0.4);
  background: linear-gradient(135deg, oklch(0.86 0.20 130 / 0.16), oklch(0.86 0.20 130 / 0.04));
  color: oklch(0.86 0.20 130);
  font-size: 13px;
  font-weight: 700;
  text-decoration: none;
  transition: transform 120ms var(--ease-out), box-shadow 120ms var(--ease-out), background 120ms var(--ease-out);
}
.kofi-btn:hover {
  transform: translateY(-1px);
  background: linear-gradient(135deg, oklch(0.86 0.20 130 / 0.26), oklch(0.86 0.20 130 / 0.08));
  box-shadow: 0 6px 16px oklch(0.86 0.20 130 / 0.2);
}
.kofi-btn .kofi-ico { font-size: 15px; line-height: 1; }

.tookbot-plus-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 8px;
  padding: 10px 14px;
  border-radius: var(--r-2);
  border: 1px solid oklch(0.78 0.16 60 / 0.45);
  background: linear-gradient(135deg, oklch(0.78 0.16 60 / 0.16), oklch(0.78 0.16 60 / 0.04));
  color: oklch(0.78 0.16 60);
  font-size: 13px;
  font-weight: 700;
  text-decoration: none;
  transition: transform 120ms var(--ease-out), box-shadow 120ms var(--ease-out), background 120ms var(--ease-out);
}
.tookbot-plus-btn:hover {
  transform: translateY(-1px);
  background: linear-gradient(135deg, oklch(0.78 0.16 60 / 0.28), oklch(0.78 0.16 60 / 0.08));
  box-shadow: 0 6px 16px oklch(0.78 0.16 60 / 0.22);
}
.tookbot-plus-btn .tbp-ico {
  font-size: 22px;
  line-height: 1;
  font-weight: 900;
  margin-top: -2px;
}

.sidebar-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-2);
  padding-top: var(--s-4);
  border-top: 1px solid var(--border-soft);
  margin-top: var(--s-3);
}
.theme-cycle, .icon-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-2);
  padding: 8px;
  border-radius: var(--r-1);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background 120ms var(--ease-out), color 120ms var(--ease-out), border-color 120ms var(--ease-out);
}
.theme-cycle:hover, .icon-btn:hover { background: var(--bg-2); color: var(--text); }

/* MAIN */
.main { display: flex; flex-direction: column; min-width: 0; }
.topbar {
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-4);
  padding: 0 var(--s-6);
  border-bottom: 1px solid var(--border-soft);
  background: oklch(from var(--bg) l c h / 0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 20;
}
.topbar .crumb {
  font-size: var(--t-base);
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: var(--s-2);
}
.topbar .crumb .sep { color: var(--text-3); margin: 0 4px; }
.topbar .actions { display: flex; gap: var(--s-2); align-items: center; }

.content {
  padding: var(--s-7) var(--s-7) var(--s-10);
  max-width: 1320px;
  width: 100%;
  margin: 0 auto;
  flex: 1;
}

/* Mobile drawer */
.drawer-toggle { display: none; }
.scrim {
  display: none;
  position: fixed; inset: 0;
  background: var(--bg-overlay);
  z-index: 40;
}
@media (max-width: 880px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: 280px;
    transform: translateX(-100%);
    transition: transform 240ms var(--ease-quart);
    z-index: 50;
  }
  .sidebar[data-open="true"] { transform: translateX(0); }
  .drawer-toggle { display: inline-flex; }
  .topbar { padding: 0 var(--s-4); }
  .content { padding: var(--s-5) var(--s-4) var(--s-9); }
  .scrim[data-open="true"] { display: block; }
}

/* ========================================================================
   Buttons
   ======================================================================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s-2);
  padding: 8px 16px;
  border-radius: var(--r-2);
  font-family: var(--font-sans);
  font-size: var(--t-sm);
  font-weight: 500;
  line-height: 1.2;
  border: 1px solid transparent;
  cursor: pointer;
  text-decoration: none;
  transition: background 120ms var(--ease-out), border-color 120ms var(--ease-out), color 120ms var(--ease-out);
  white-space: nowrap;
  letter-spacing: -0.005em;
}
.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.btn-primary    { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }

.btn-secondary  { background: var(--bg-2); color: var(--text); border-color: var(--border); }
.btn-secondary:hover { background: var(--bg-3); border-color: var(--border-strong); }

.btn-ghost      { background: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--bg-2); color: var(--text); }

.btn-danger     { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn-danger:hover { background: var(--danger-soft); }

.btn-sm { padding: 5px 11px; font-size: var(--t-xs); border-radius: var(--r-1); }
.btn-lg { padding: 10px 20px; font-size: var(--t-base); }
.btn-block { width: 100%; }
.btn .ic { width: 14px; height: 14px; }

/* ========================================================================
   Cards
   ======================================================================== */
.card {
  background: linear-gradient(180deg, var(--bg-1) 0%, oklch(0.195 0.005 60) 100%);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 22px 24px;
  transition: border-color 160ms var(--ease-out);
}
.card:hover { border-color: oklch(0.40 0.010 60 / 0.5); }
.card.tight   { padding: var(--s-4); }
.card.padless { padding: 0; }
.card-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); }

/* ========================================================================
   Inputs
   ======================================================================== */
.field { display: flex; flex-direction: column; gap: 6px; }
label, .label {
  font-size: var(--t-xs);
  font-weight: 500;
  color: var(--text-2);
  letter-spacing: 0;
  text-transform: none;
}

input[type="text"], input[type="number"], input[type="password"],
input[type="email"], select, textarea {
  width: 100%;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--r-2);
  padding: 9px 12px;
  font-family: var(--font-sans);
  font-size: var(--t-sm);
  line-height: 1.4;
  transition: border-color 120ms var(--ease-out), box-shadow 120ms var(--ease-out), background 120ms var(--ease-out);
}
input::placeholder, textarea::placeholder { color: var(--text-3); }
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
input:disabled { background: var(--bg-2); color: var(--text-3); cursor: not-allowed; }
textarea { min-height: 72px; resize: vertical; }

select {
  appearance: none;
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath fill='none' stroke='%23999' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round' d='M1 1l4 4 4-4'/%3E%3C/svg%3E");
  background-position: right 12px center;
  background-repeat: no-repeat;
  padding-right: 32px;
}

/* Search input with icon */
.input-search { position: relative; }
.input-search input { padding-left: 36px; }
.input-search .ic {
  position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%);
  width: 14px; height: 14px;
  color: var(--text-3);
  pointer-events: none;
}

/* ========================================================================
   Tables
   ======================================================================== */
.tbl {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: var(--t-sm);
}
.tbl thead th {
  text-align: left;
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-3);
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  background: transparent;
}
.tbl tbody td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border-soft);
  color: var(--text);
}
.tbl tbody tr { transition: background 100ms var(--ease-out); }
.tbl tbody tr:hover { background: var(--bg-2); cursor: pointer; }
.tbl tbody tr:last-child td { border-bottom: none; }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: var(--t-sm); }
.tbl td.mono { font-family: var(--font-mono); color: var(--text-2); font-size: 13px; }

/* ========================================================================
   Stats / KPI tiles (varied, NOT identical card grid)
   ======================================================================== */
.stat {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 20px 22px;
  background: linear-gradient(180deg, var(--bg-1) 0%, oklch(0.195 0.005 60) 100%);
  border: 1px solid var(--border);
  border-radius: 16px;
  transition: border-color 160ms var(--ease-out);
}
.stat:hover { border-color: oklch(0.40 0.010 60 / 0.5); }
.stat .stat-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-2);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.stat .stat-value {
  font-size: 32px;
  font-weight: 600;
  letter-spacing: -0.025em;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  line-height: 1.1;
  line-height: 1;
}
.stat .stat-sub { font-size: var(--t-xs); color: var(--text-2); }

/* ========================================================================
   Badges
   ======================================================================== */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 8px;
  border-radius: var(--r-1);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.02em;
  background: var(--bg-2);
  color: var(--text-2);
  border: 1px solid var(--border);
  font-family: var(--font-sans);
  white-space: nowrap;
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge-accent  { background: var(--accent-soft); color: var(--accent-strong); border-color: transparent; }
.badge-danger  { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.badge-success { color: var(--success); }
.badge-mono    { font-family: var(--font-mono); font-size: 11px; }

.badge-rar-C   { color: var(--rar-c); }
.badge-rar-UC  { color: var(--rar-uc); }
.badge-rar-R   { color: var(--rar-r); }
.badge-rar-SR  { color: var(--rar-sr); }
.badge-rar-SSR { color: var(--rar-ssr); }

/* ========================================================================
   Alerts (toast-style banner)
   ======================================================================== */
.toast-stack {
  position: fixed;
  bottom: var(--s-6);
  right: var(--s-6);
  display: flex;
  flex-direction: column;
  gap: var(--s-2);
  z-index: 80;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  background: var(--bg-1);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--r-2);
  padding: 10px 14px;
  font-size: var(--t-sm);
  display: flex;
  align-items: center;
  gap: var(--s-2);
  box-shadow: var(--shadow-2);
  animation: toast-in 200ms var(--ease-out);
  max-width: 360px;
}
.toast.success { border-color: var(--success); }
.toast.error   { border-color: var(--danger); color: var(--danger); }
.toast.success .ic { color: var(--success); }
.toast.error .ic   { color: var(--danger); }
@keyframes toast-in {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ========================================================================
   Tabs
   ======================================================================== */
.tabs {
  display: flex;
  align-items: center;
  gap: 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: var(--s-6);
}
.tabs button {
  padding: 10px 16px;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-2);
  font-family: var(--font-sans);
  font-size: var(--t-sm);
  font-weight: 500;
  cursor: pointer;
  transition: color 120ms var(--ease-out), border-color 120ms var(--ease-out);
  margin-bottom: -1px;
}
.tabs button:hover { color: var(--text); }
.tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
.tab-content { display: none; animation: tab-in 240ms var(--ease-out); }
.tab-content.active { display: block; }
@keyframes tab-in {
  from { opacity: 0; transform: translateY(2px); }
  to   { opacity: 1; transform: none; }
}

/* ========================================================================
   Modal — unique place where blur is allowed
   ======================================================================== */
.modal-overlay {
  position: fixed; inset: 0;
  background: var(--bg-overlay);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 90;
  padding: var(--s-4);
  animation: fade-in 200ms var(--ease-out);
}
.modal {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r-4);
  padding: var(--s-7);
  max-width: 640px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-3);
  animation: modal-in 220ms var(--ease-out);
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes modal-in {
  from { opacity: 0; transform: translateY(8px) scale(0.97); }
  to   { opacity: 1; transform: none; }
}

/* Skeleton loaders : placeholder shimmer le temps du fetch */
.skel {
  display: block;
  background: linear-gradient(
    90deg,
    var(--bg-2) 0%,
    var(--bg-1) 50%,
    var(--bg-2) 100%
  );
  background-size: 200% 100%;
  border-radius: 6px;
  animation: skel-shimmer 1.6s ease-in-out infinite;
}
.skel-line { height: 14px; margin: 6px 0; }
.skel-line.lg { height: 20px; }
.skel-block { height: 80px; }
.skel-circle { border-radius: 50%; }
@keyframes skel-shimmer {
  0%   { background-position: 100% 0; }
  100% { background-position: -100% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .skel { animation: none; opacity: 0.6; }
}

/* Heatmap detail popover (interactive heatmap) */
.heatmap-detail {
  position: fixed;
  z-index: 200;
  min-width: 280px;
  max-width: 360px;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--bg-1);
  box-shadow: var(--shadow-3);
  animation: fade-in 160ms var(--ease-out, ease-out);
}
.heatmap-detail .hd-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.heatmap-detail .hd-close {
  background: none; border: none; cursor: pointer; color: var(--text-2);
  font-size: 18px; padding: 0; line-height: 1;
}
.heatmap-detail .hd-row {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 4px 0; font-size: var(--t-sm);
}
.heatmap-detail .hd-row .hd-label {
  color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.heatmap-detail .hd-row .hd-count {
  color: var(--accent); font-family: var(--font-mono); font-weight: 700;
}

/* ========================================================================
   Bar list (replaces matplotlib chart)
   ======================================================================== */
.bar-list { display: flex; flex-direction: column; gap: var(--s-3); }
.bar-row {
  display: grid;
  grid-template-columns: 200px 1fr 120px;
  align-items: center;
  gap: var(--s-4);
  font-size: var(--t-sm);
}
.bar-row .bar-label { color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .bar-track {
  height: 8px;
  background: var(--bg-2);
  border-radius: var(--r-1);
  position: relative;
  /* pas d'overflow:hidden : on veut que le glow du fill deborde proprement */
}
.bar-row .bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: var(--r-1);
  transition: width 800ms var(--ease-quart);
}
.bar-row .bar-value { font-family: var(--font-mono); font-size: 13px; color: var(--text-2); text-align: right; }
@media (max-width: 720px) { .bar-row { grid-template-columns: 1fr 80px; } .bar-row .bar-track { display: none; } }

/* ========================================================================
   Hero parallax (dashboard only)
   ======================================================================== */
.hero {
  display: flex;
  flex-direction: column;
  gap: var(--s-2);
  padding: var(--s-6) 0 var(--s-7);
  margin-bottom: var(--s-6);
  position: relative;
  overflow: hidden;
}
.hero h1 {
  font-size: 32px;
  font-weight: 600;
  letter-spacing: -0.025em;
  line-height: 1.1;
}
.hero .hero-sub { color: var(--text-2); max-width: 60ch; font-size: 14px; line-height: 1.55; }
.hero .eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 4px;
}
.hero .parallax-layer { will-change: transform; }
.hero-glow {
  position: absolute;
  pointer-events: none;
  width: 540px; height: 540px;
  top: -240px; right: -120px;
  background: radial-gradient(closest-side, var(--accent-soft), transparent 70%);
  opacity: 0.6;
  z-index: -1;
  will-change: transform;
}
@media (prefers-reduced-motion: reduce) {
  .hero .parallax-layer, .hero-glow { transform: none !important; }
}

/* ========================================================================
   Helpers
   ======================================================================== */
.row { display: flex; gap: var(--s-3); align-items: center; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: var(--s-3); }
.between { justify-content: space-between; }
.end { justify-content: flex-end; }
.grid { display: grid; gap: var(--s-4); }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.grid-4 { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.gap-2 { gap: var(--s-2); } .gap-3 { gap: var(--s-3); } .gap-5 { gap: var(--s-5); } .gap-7 { gap: var(--s-7); }
.mt-2 { margin-top: var(--s-3); } .mt-4 { margin-top: var(--s-5); } .mt-6 { margin-top: var(--s-7); } .mt-8 { margin-top: var(--s-9); }
.mb-4 { margin-bottom: var(--s-5); } .mb-6 { margin-bottom: var(--s-7); }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

.kbd {
  display: inline-block;
  padding: 1px 6px;
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: var(--r-1);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-2);
  background: var(--bg);
}

.divider {
  height: 1px;
  background: var(--border-soft);
  margin: var(--s-6) 0;
}

/* Scrollbars */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 8px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

::selection { background: var(--accent-soft); color: var(--text); }

/* ========================================================================
   Heatmap (24h x 7 jours)
   ======================================================================== */
.heatmap-wrap { overflow-x: auto; padding: 4px 0; }
.heatmap-grid {
  display: grid;
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--text-3);
}
.hm-day-label  { display: flex; align-items: center; padding-right: 4px; color: var(--text-2); }
.hm-hour-label { display: flex; align-items: center; justify-content: center; height: 16px; }
.hm-cell {
  width: 100%;
  aspect-ratio: 1 / 1;
  background: var(--accent);
  border-radius: 2px;
  transition: transform 100ms var(--ease-out);
  cursor: pointer;
}
.hm-cell:hover { transform: scale(1.4); z-index: 1; outline: 1px solid var(--accent); }

/* Sparkline tooltip + glow */
.spark-wrap {
  position: relative;
}
.spark-wrap svg { cursor: crosshair; }
.spark-tooltip {
  position: absolute;
  pointer-events: none;
  background: var(--bg-1);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 12px;
  font-family: var(--font-mono);
  color: var(--text);
  box-shadow: 0 6px 18px oklch(0 0 0 / 0.35);
  white-space: nowrap;
  z-index: 10;
  transform: translate(-50%, calc(-100% - 10px));
  transition: opacity 80ms;
}
.spark-tooltip .tt-label { color: var(--text-3); font-size: 11px; }
.spark-tooltip .tt-value { color: var(--accent); font-weight: 600; }

/* ============================================================================
   LIME GLOW : applique un halo subtil aux elements accentues
   ============================================================================ */

/* CTA buttons */
.btn-primary {
  box-shadow: 0 0 14px oklch(0.86 0.20 130 / 0.28),
              0 1px 2px oklch(0 0 0 / 0.3);
  transition: box-shadow 160ms var(--ease-out), background 120ms var(--ease-out);
}
.btn-primary:hover {
  box-shadow: 0 0 20px oklch(0.86 0.20 130 / 0.45),
              0 2px 4px oklch(0 0 0 / 0.3);
}

/* Support button (already has its own shadow, enhance) */
.support-btn {
  box-shadow: 0 0 18px oklch(0.86 0.20 130 / 0.35),
              0 4px 14px oklch(0.86 0.20 130 / 0.25) !important;
}
.support-btn:hover {
  box-shadow: 0 0 28px oklch(0.86 0.20 130 / 0.55),
              0 6px 18px oklch(0.86 0.20 130 / 0.4) !important;
}

/* Pills lime accent */
.pill-accent {
  box-shadow: 0 0 10px oklch(0.86 0.20 130 / 0.22);
}

/* Stat-card icon glow permanent (etait hover only) */
.stat-card .stat-head .stat-icon .ic {
  filter: drop-shadow(0 0 6px oklch(0.86 0.20 130 / 0.45));
}

/* Sidebar active item bar - amplifie */
.sidebar a.nav-item.active::before {
  box-shadow: 0 0 12px oklch(0.86 0.20 130 / 0.75),
              0 0 4px oklch(0.86 0.20 130 / 0.9);
}

/* Sidebar nav-cat header (categorie active : meme glow leger) */
.sidebar details.nav-cat[open] > summary .nav-section {
  box-shadow: 0 0 16px oklch(0.86 0.20 130 / 0.12);
}

/* Lime checkbox / switch / toggle */
input:checked + .slider {
  box-shadow: 0 0 12px oklch(0.86 0.20 130 / 0.4) !important;
}

/* Bars de progression / barres horizontales lime */
.bar-row .bar-fill,
.bar-h-bar,
.progress-fill,
.barre-hp-fill,
.gauge-fill,
.xp-bar-fill,
.boost-fill {
  box-shadow: 0 0 10px oklch(0.86 0.20 130 / 0.45),
              0 0 3px oklch(0.86 0.20 130 / 0.6);
}

/* Bars status / system (CPU/RAM/Disque dans /status) deja en lime */
.bar-row .bar-fill,
[style*="background: var(--accent)"] {
  box-shadow: 0 0 8px oklch(0.86 0.20 130 / 0.4);
}

/* Heatmap cells les plus chaudes */
.hm-cell {
  box-shadow: 0 0 4px oklch(0.86 0.20 130 / 0.2);
}

/* Brand image lime tint glow (deja gere via brand::before mais on uniformise) */

/* Class utilitaire generique */
.lime-glow {
  filter: drop-shadow(0 0 8px oklch(0.86 0.20 130 / 0.5));
}
.lime-glow-soft {
  filter: drop-shadow(0 0 4px oklch(0.86 0.20 130 / 0.3));
}

/* ============================================================================
   MODERN COMPONENTS — pills, stat cards v2, section cards, topbar enriched
   ============================================================================ */

/* Unified pill system */
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.02em;
  line-height: 1.4;
  border: 1px solid transparent;
  white-space: nowrap;
}
.pill::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}
.pill.no-dot::before { display: none; }
.pill-success {
  background: oklch(0.78 0.18 145 / .15);
  color: oklch(0.82 0.18 145);
  border-color: oklch(0.78 0.18 145 / .35);
}
.pill-warning {
  background: oklch(0.78 0.18 80 / .18);
  color: oklch(0.85 0.18 80);
  border-color: oklch(0.78 0.18 80 / .35);
}
.pill-danger {
  background: oklch(0.65 0.20 25 / .18);
  color: oklch(0.85 0.20 25);
  border-color: oklch(0.65 0.20 25 / .35);
}
.pill-info {
  background: oklch(0.65 0.18 250 / .18);
  color: oklch(0.82 0.18 250);
  border-color: oklch(0.65 0.18 250 / .35);
}
.pill-accent {
  background: oklch(0.86 0.20 130 / .18);
  color: oklch(0.86 0.20 130);
  border-color: oklch(0.86 0.20 130 / .35);
}
.pill-neutral {
  background: var(--bg-2);
  color: var(--text-2);
  border-color: var(--border);
}

/* Modern stat card v2 : icon + label + big value + delta + sparkline slot */
.stat-card {
  background: linear-gradient(180deg, var(--bg-1) 0%, oklch(0.195 0.005 60) 100%);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 22px 24px 20px;
  display: flex; flex-direction: column; gap: 14px;
  transition: border-color 160ms var(--ease-out), transform 160ms var(--ease-out);
  position: relative;
  overflow: hidden;
}
.stat-card::after {
  /* Subtle accent glow top-left, like the references */
  content: "";
  position: absolute;
  top: -40px; left: -40px;
  width: 160px; height: 160px;
  background: radial-gradient(circle, oklch(0.86 0.20 130 / .08) 0%, transparent 70%);
  pointer-events: none;
  opacity: 0;
  transition: opacity 200ms var(--ease-out);
}
.stat-card:hover {
  border-color: oklch(0.86 0.20 130 / 0.4);
  transform: translateY(-1px);
}
.stat-card:hover::after { opacity: 1; }

.stat-card .stat-head {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; color: var(--text-2); font-weight: 500;
  letter-spacing: 0.01em;
}
.stat-card .stat-head .stat-icon {
  display: inline-flex; align-items: center; gap: 8px;
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--text-2);
}
.stat-card .stat-head .stat-icon .ic {
  width: 14px; height: 14px;
  color: var(--accent);
  filter: drop-shadow(0 0 6px oklch(0.86 0.20 130 / .4));
}
.stat-card .stat-head .stat-menu {
  color: var(--text-3); cursor: pointer;
  background: none; border: none; padding: 2px 6px;
  font-size: 16px; line-height: 1;
  letter-spacing: 0;
}
.stat-card .stat-head .stat-menu:hover { color: var(--text); }
.stat-card .stat-body {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.stat-card .stat-num {
  font-size: 36px; font-weight: 600; letter-spacing: -0.03em;
  font-family: var(--font-sans);
  color: var(--text);
  line-height: 1;
}
.stat-card .stat-num .stat-unit {
  font-size: 16px; color: var(--text-3); font-weight: 400;
  margin-left: 6px;
  letter-spacing: 0;
}
.stat-card .stat-spark {
  flex-shrink: 0;
  display: flex; align-items: flex-end; gap: 3px;
  height: 38px;
}
.stat-card .stat-spark .bar {
  width: 5px;
  background: linear-gradient(180deg, var(--accent), oklch(0.78 0.22 130));
  border-radius: 2px 2px 0 0;
  min-height: 4px;
  opacity: 0.85;
}
.stat-card .stat-spark.spark-purple .bar { background: linear-gradient(180deg, oklch(0.72 0.20 305), oklch(0.62 0.22 305)); }
.stat-card .stat-spark.spark-blue   .bar { background: linear-gradient(180deg, oklch(0.78 0.18 240), oklch(0.65 0.20 240)); }
.stat-card .stat-spark.spark-orange .bar { background: linear-gradient(180deg, oklch(0.82 0.20 60),  oklch(0.70 0.22 40)); }
.stat-card .stat-spark.spark-red    .bar { background: linear-gradient(180deg, oklch(0.78 0.20 25),  oklch(0.62 0.22 25)); }

.stat-card .stat-delta {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 600;
  color: var(--text-2);
}
.stat-card .stat-delta.up   { color: oklch(0.82 0.18 145); }
.stat-card .stat-delta.up::before   { content: "▲"; font-size: 9px; }
.stat-card .stat-delta.down { color: oklch(0.78 0.20 25); }
.stat-card .stat-delta.down::before { content: "▼"; font-size: 9px; }
.stat-card .stat-foot {
  font-size: 12px; color: var(--text-3);
  display: flex; align-items: center; gap: 6px;
  padding-top: 8px;
  border-top: 1px solid var(--border-soft);
}
.stat-card .stat-foot .stat-foot-label { color: var(--text-3); }

/* Tab pills (Overview / Metrics / Evaluations) */
.tab-pills {
  display: inline-flex; gap: 4px;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 4px;
}
.tab-pills .tab {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  font-size: 13px; font-weight: 500;
  color: var(--text-2);
  border-radius: 7px;
  cursor: pointer;
  border: none; background: none;
  transition: all 120ms var(--ease-out);
  white-space: nowrap;
}
.tab-pills .tab:hover { color: var(--text); background: var(--bg-2); }
.tab-pills .tab.active {
  background: var(--bg-2);
  color: var(--text);
  box-shadow: 0 0 0 1px var(--border-strong);
}
.tab-pills .tab .ic { width: 14px; height: 14px; }

/* Section card avec header riche : icon + title + actions */
.section-card {
  background: linear-gradient(180deg, var(--bg-1) 0%, oklch(0.195 0.005 60) 100%);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 22px 24px;
  margin-bottom: var(--s-5);
}
.section-card-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  margin-bottom: var(--s-4);
}
.section-card-head .sc-title {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 15px; font-weight: 600;
  color: var(--text);
}
.section-card-head .sc-title .ic { width: 16px; height: 16px; color: var(--accent); }
.section-card-head .sc-actions {
  display: inline-flex; gap: 8px; align-items: center;
}
.section-card-head .sc-actions .btn {
  font-size: 12px; padding: 5px 12px;
}

/* Topbar enrichi : back / forward arrows */
.topbar-nav {
  display: inline-flex; gap: 4px; align-items: center;
}
.topbar-nav .nav-arrow {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-2);
  cursor: pointer;
  transition: all 120ms var(--ease-out);
}
.topbar-nav .nav-arrow:hover {
  border-color: var(--border-strong);
  color: var(--text);
}

.topbar-nav .nav-arrow.disabled {
